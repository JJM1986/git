let drag = null;        // laufende Interaktion
let cropRect = null;    // Vorschau beim Zuschneiden

/* Griffe und Auswahlrahmen folgen der Akzentfarbe des Stylesheets,
   damit ein Farbwechsel im Theme nur an einer Stelle noetig ist. */
const akzent = () => getComputedStyle(document.documentElement)
  .getPropertyValue('--accent').trim() || '#ede813';

const getCropRect = () => cropRect;
const clearCrop = () => { cropRect = null; };

/* ---------------- Pinselstempel ---------------- */

function stamp(size, hardness, color) {
  const r = Math.max(0.5, size / 2);
  const c = makeCanvas(Math.ceil(r * 2) + 2, Math.ceil(r * 2) + 2);
  const ctx = c.getContext('2d');
  const cx = c.width / 2, cy = c.height / 2;
  if (hardness >= 0.995) {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  } else {
    const g = ctx.createRadialGradient(cx, cy, r * hardness, cx, cy, r);
    g.addColorStop(0, color);
    g.addColorStop(1, color.length === 7 ? color + '00' : 'transparent');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, c.width, c.height);
  }
  return c;
}

function paintSegment(ctx, from, to, brush, erase, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.globalCompositeOperation = erase ? 'destination-out' : 'source-over';
  const dx = to.x - from.x, dy = to.y - from.y;
  const dist = Math.hypot(dx, dy);
  const step = Math.max(1, brush.width * 0.14);
  const n = Math.max(1, Math.ceil(dist / step));
  for (let i = 0; i <= n; i++) {
    const x = from.x + (dx * i) / n, y = from.y + (dy * i) / n;
    ctx.drawImage(brush, x - brush.width / 2, y - brush.height / 2);
  }
  ctx.restore();
}

/* ---------------- Transformationsgriffe ---------------- */

function handlesFor(layer) {
  if (!layer) return null;
  const c = layerCorners(layer);
  const mTop = { x: (c[0].x + c[1].x) / 2, y: (c[0].y + c[1].y) / 2 };
  const center = { x: (c[0].x + c[2].x) / 2, y: (c[0].y + c[2].y) / 2 };
  let nx = mTop.x - center.x, ny = mTop.y - center.y;
  const len = Math.hypot(nx, ny) || 1;
  const off = 26 / state.zoom;
  return {
    corners: c,
    center,
    rotate: { x: mTop.x + (nx / len) * off, y: mTop.y + (ny / len) * off },
  };
}

function hitHandle(layer, p) {
  const h = handlesFor(layer);
  if (!h) return null;
  const tol = 9 / state.zoom;
  const near = (a) => Math.hypot(a.x - p.x, a.y - p.y) <= tol;
  if (near(h.rotate)) return { kind: 'rotate' };
  for (let i = 0; i < 4; i++) if (near(h.corners[i])) return { kind: 'scale', corner: i };
  return null;
}

function rot(v, a) {
  return { x: v.x * Math.cos(a) - v.y * Math.sin(a), y: v.x * Math.sin(a) + v.y * Math.cos(a) };
}

/* Skaliert die Ebene so, dass die gegenüberliegende Ecke ortsfest bleibt. */
function applyScale(layer, cornerIdx, p, proportional) {
  const w = layer.canvas.width, h = layer.canvas.height;
  const anchorIdx = (cornerIdx + 2) % 4;
  const local = [[0, 0], [w, 0], [w, h], [0, h]];
  const [ax, ay] = local[anchorIdx];
  const A = drag.anchorDoc;
  const v = rot({ x: p.x - A.x, y: p.y - A.y }, -layer.rot);
  const dirX = ax === 0 ? 1 : -1, dirY = ay === 0 ? 1 : -1;
  let sx = (v.x * dirX) / w, sy = (v.y * dirY) / h;
  const min = 2 / Math.max(w, h);
  if (proportional) {
    const s = Math.max(Math.abs(sx), Math.abs(sy));
    sx = Math.sign(sx || 1) * s; sy = Math.sign(sy || 1) * s;
  }
  sx = Math.abs(sx) < min ? min * Math.sign(sx || 1) : sx;
  sy = Math.abs(sy) < min ? min * Math.sign(sy || 1) : sy;
  layer.sx = sx; layer.sy = sy;
  const off = rot({ x: (w / 2 - ax) * sx, y: (h / 2 - ay) * sy }, layer.rot);
  const cx = A.x + off.x, cy = A.y + off.y;
  layer.x = cx - (w * sx) / 2;
  layer.y = cy - (h * sy) / 2;
}

/* ---------------- Ebenen-Hilfen ---------------- */

function topLayerAt(p) {
  const ls = page().layers;
  for (let i = ls.length - 1; i >= 0; i--) {
    const l = ls[i];
    if (!l.visible) continue;
    if (!hitLayer(l, p.x, p.y)) continue;
    const lp = docToLayer(l, p.x, p.y);
    const ctx = l.canvas.getContext('2d', { willReadFrequently: true });
    const a = ctx.getImageData(Math.floor(lp.x), Math.floor(lp.y), 1, 1).data[3];
    if (a > 8) return l;
  }
  return null;
}

/** Liefert eine bemalbare Rasterebene – legt bei Bedarf eine neue an. */
function paintTarget() {
  let l = activeLayer();
  if (!l || l.type !== 'raster') {
    const p = page();
    l = addLayer(createLayer({ name: 'Ebene ' + (p.layers.length + 1), w: p.width, h: p.height }));
    say('Neue Rasterebene angelegt');
  }
  return l;
}

function brushScale(layer) {
  return (Math.abs(layer.sx) + Math.abs(layer.sy)) / 2 || 1;
}

/* ---------------- Zeigerereignisse ---------------- */

function pointerDown(p, ev) {
  const t = state.tool;
  const P = page();
  if (!P) return;

  if (t === 'eyedrop') {
    const c = makeCanvas(P.width, P.height);
    const ctx = c.getContext('2d', { willReadFrequently: true });
    renderPage(P, ctx, { scale: 1 });
    const x = Math.min(P.width - 1, Math.max(0, Math.floor(p.x)));
    const y = Math.min(P.height - 1, Math.max(0, Math.floor(p.y)));
    const d = ctx.getImageData(x, y, 1, 1).data;
    const hex = rgbToHex(d[0], d[1], d[2]);
    if (ev.altKey) state.bg = hex; else state.fg = hex;
    if (!state.recentColors.includes(hex)) state.recentColors.unshift(hex);
    state.recentColors.length = Math.min(state.recentColors.length, 12);
    say('Farbe aufgenommen: ' + hex);
    notify();
    return;
  }

  if (t === 'select' || t === 'crop') {
    commit(t === 'crop' ? 'Zuschneiden' : 'Auswahl');
    drag = { mode: t, start: p };
    if (t === 'select') state.selection = { x: p.x, y: p.y, w: 0, h: 0 };
    else cropRect = { x: p.x, y: p.y, w: 0, h: 0 };
    notify();
    return;
  }

  if (t === 'brush' || t === 'eraser') {
    commit(t === 'brush' ? 'Pinsel' : 'Radierer');
    const layer = paintTarget();
    const ctx = beginPixelEdit(layer);
    const s = brushScale(layer);
    const color = ev.altKey ? state.bg : state.fg;
    const brush = stamp(opts.size / s, opts.hardness, t === 'eraser' ? '#000000' : color);
    const lp = docToLayer(layer, p.x, p.y);
    paintSegment(ctx, lp, lp, brush, t === 'eraser', opts.flow);
    drag = { mode: 'paint', layer, ctx, brush, last: lp, erase: t === 'eraser' };
    notify();
    return;
  }

  if (t === 'bucket') {
    const layer = paintTarget();
    commit('Füllen');
    const ctx = beginPixelEdit(layer);
    const lp = docToLayer(layer, p.x, p.y);
    if (state.selection) {
      // Nur innerhalb der Auswahl füllen
      const sel = state.selection;
      ctx.save();
      ctx.beginPath();
      const inv = layerMatrix(layer).inverse();
      const pts = [[sel.x, sel.y], [sel.x + sel.w, sel.y], [sel.x + sel.w, sel.y + sel.h], [sel.x, sel.y + sel.h]]
        .map(([x, y]) => inv.transformPoint(new DOMPoint(x, y)));
      ctx.moveTo(pts[0].x, pts[0].y);
      pts.slice(1).forEach(q => ctx.lineTo(q.x, q.y));
      ctx.closePath();
      ctx.clip();
      ctx.fillStyle = ev.altKey ? state.bg : state.fg;
      ctx.fillRect(0, 0, layer.canvas.width, layer.canvas.height);
      ctx.restore();
    } else {
      floodFill(layer.canvas, lp.x, lp.y, ev.altKey ? state.bg : state.fg, opts.tolerance);
    }
    notify();
    return;
  }

  if (t === 'text') {
    const hit = topLayerAt(p);
    if (hit && hit.type === 'text') { setActiveLayer(hit.id); notify(); return; }
    commit('Text');
    const text = defaultText('Neuer Text');
    text.size = opts.fontSize;
    text.color = state.fg;
    const layer = createLayer({ name: 'Text', type: 'text', text });
    rasterizeText(layer);
    layer.x = p.x - 10; layer.y = p.y - layer.canvas.height / 2;
    addLayer(layer);
    say('Textebene angelegt – Inhalt rechts im Schrift-Panel bearbeiten');
    notify();
    return;
  }

  if (t === 'rect' || t === 'ellipse' || t === 'line') {
    commit('Form');
    const shape = {
      kind: t, w: 1, h: 1,
      fill: opts.fillShape ? state.fg : 'none',
      stroke: state.bg,
      strokeWidth: t === 'line' ? Math.max(1, opts.strokeWidth) : (opts.fillShape ? 0 : Math.max(1, opts.strokeWidth)),
      radius: opts.radius,
    };
    if (t === 'line') shape.stroke = state.fg;
    const layer = createLayer({ name: t === 'line' ? 'Linie' : t === 'rect' ? 'Rechteck' : 'Ellipse', type: 'shape', shape });
    layer.x = p.x; layer.y = p.y;
    rasterizeShape(layer);
    addLayer(layer);
    drag = { mode: 'shape', layer, start: p };
    notify();
    return;
  }

  if (t === 'move') {
    const act = activeLayer();
    const handle = act ? hitHandle(act, p) : null;
    if (handle) {
      commit('Transformieren');
      const c = layerCorners(act);
      drag = {
        mode: handle.kind, layer: act, start: p, corner: handle.corner,
        anchorDoc: handle.kind === 'scale' ? c[(handle.corner + 2) % 4] : null,
        startRot: act.rot,
        startAngle: Math.atan2(p.y - handlesFor(act).center.y, p.x - handlesFor(act).center.x),
        center: handlesFor(act).center,
      };
      return;
    }
    const hit = (act && hitLayer(act, p.x, p.y) && topLayerAt(p) === act) ? act : topLayerAt(p);
    if (!hit) { state.selection = null; notify(); return; }
    setActiveLayer(hit.id);
    commit('Verschieben');
    drag = { mode: 'move', layer: hit, start: p, ox: hit.x, oy: hit.y };
    notify();
  }
}

function pointerMove(p, ev) {
  if (!drag) return;
  const l = drag.layer;
  switch (drag.mode) {
    case 'paint': {
      const lp = docToLayer(l, p.x, p.y);
      paintSegment(drag.ctx, drag.last, lp, drag.brush, drag.erase, opts.flow);
      drag.last = lp;
      break;
    }
    case 'move': {
      let dx = p.x - drag.start.x, dy = p.y - drag.start.y;
      if (ev.shiftKey) { if (Math.abs(dx) > Math.abs(dy)) dy = 0; else dx = 0; }
      l.x = drag.ox + dx; l.y = drag.oy + dy;
      break;
    }
    case 'scale':
      applyScale(l, drag.corner, p, ev.shiftKey);
      break;
    case 'rotate': {
      const a = Math.atan2(p.y - drag.center.y, p.x - drag.center.x);
      let r = drag.startRot + (a - drag.startAngle);
      if (ev.shiftKey) r = Math.round(r / (Math.PI / 12)) * (Math.PI / 12);
      const w = l.canvas.width, h = l.canvas.height;
      const c = { x: l.x + (w * l.sx) / 2, y: l.y + (h * l.sy) / 2 };
      l.rot = r;
      l.x = c.x - (w * l.sx) / 2; l.y = c.y - (h * l.sy) / 2;
      break;
    }
    case 'select':
    case 'crop': {
      const r = normRect(drag.start, p, ev.shiftKey);
      if (drag.mode === 'select') state.selection = r; else cropRect = r;
      break;
    }
    case 'shape': {
      const s = l.shape;
      if (s.kind === 'line') {
        s.w = p.x - drag.start.x; s.h = p.y - drag.start.y;
        const pad = Math.ceil(s.strokeWidth) + 2;
        l.x = Math.min(drag.start.x, p.x) - pad;
        l.y = Math.min(drag.start.y, p.y) - pad;
      } else {
        const r = normRect(drag.start, p, ev.shiftKey);
        s.w = Math.max(1, r.w); s.h = Math.max(1, r.h);
        const pad = Math.ceil(s.strokeWidth) + 2;
        l.x = r.x - pad; l.y = r.y - pad;
      }
      rasterizeShape(l);
      break;
    }
  }
  notify();
}

function pointerUp() {
  if (!drag) return;
  if (drag.mode === 'select' && state.selection && (state.selection.w < 2 || state.selection.h < 2))
    state.selection = null;
  if (drag.mode === 'shape') say('Form erstellt – Größe und Farbe bleiben über die Ebene änderbar');
  drag = null;
  notify();
}

const isDragging = () => !!drag;

function normRect(a, b, square) {
  let w = b.x - a.x, h = b.y - a.y;
  if (square) { const s = Math.max(Math.abs(w), Math.abs(h)); w = Math.sign(w || 1) * s; h = Math.sign(h || 1) * s; }
  return { x: Math.min(a.x, a.x + w), y: Math.min(a.y, a.y + h), w: Math.abs(w), h: Math.abs(h) };
}

/* ---------------- Overlay (Griffe, Auswahl) ---------------- */

function drawOverlay(ctx) {
  const z = state.zoom;
  const P = page();
  if (!P) return;
  ctx.setTransform(z, 0, 0, z, 0, 0);
  ctx.clearRect(0, 0, P.width, P.height);
  ctx.lineWidth = 1 / z;

  const dash = (r, color) => {
    ctx.save();
    ctx.strokeStyle = '#000'; ctx.setLineDash([5 / z, 4 / z]);
    ctx.strokeRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = color; ctx.lineDashOffset = 5 / z;
    ctx.strokeRect(r.x, r.y, r.w, r.h);
    ctx.restore();
  };

  if (state.selection) dash(state.selection, '#ffffff');
  if (cropRect && cropRect.w > 1) {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.beginPath();
    ctx.rect(0, 0, P.width, P.height);
    ctx.rect(cropRect.x, cropRect.y, cropRect.w, cropRect.h);
    ctx.fill('evenodd');
    ctx.restore();
    dash(cropRect, akzent());
  }

  const l = activeLayer();
  if (l && (state.tool === 'move')) {
    const h = handlesFor(l);
    ctx.save();
    ctx.strokeStyle = akzent();
    ctx.lineWidth = 1.4 / z;
    ctx.beginPath();
    ctx.moveTo(h.corners[0].x, h.corners[0].y);
    for (let i = 1; i < 4; i++) ctx.lineTo(h.corners[i].x, h.corners[i].y);
    ctx.closePath();
    ctx.stroke();

    const mTop = { x: (h.corners[0].x + h.corners[1].x) / 2, y: (h.corners[0].y + h.corners[1].y) / 2 };
    ctx.beginPath(); ctx.moveTo(mTop.x, mTop.y); ctx.lineTo(h.rotate.x, h.rotate.y); ctx.stroke();

    const r = 4.5 / z;
    ctx.fillStyle = akzent();
    for (const c of h.corners) {
      ctx.beginPath(); ctx.rect(c.x - r, c.y - r, r * 2, r * 2); ctx.fill(); ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(h.rotate.x, h.rotate.y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
}


/* ================= pdfio.js ================= */
/* Bildwerk – PDF öffnen, Seiten verwalten, PDF schreiben. */

const PT_PER_PX = 72 / 96;   // Bildschirmpixel -> PDF-Punkte
const MAX_RENDER_PX = 2600;  // Deckel gegen riesige Seiten-Canvas

const pdfSources = new Map(); // docId -> Uint8Array (Originaldatei)

async function libs() { return window.bildwerkLibs ? await window.bildwerkLibs : {}; }

async function pdfjsReady() {
  const l = await libs();
  if (!l.pdfjs?.ok) throw new Error('pdf.js ist nicht verfügbar – siehe vendor/README.md');
  return window.pdfjsLib;
}

async function pdfLibReady() {
  const l = await libs();
  if (!l.pdflib?.ok) throw new Error('pdf-lib ist nicht verfügbar – siehe vendor/README.md');
  return window.PDFLib;
}

/* ---------------- Import ---------------- */

async function importPdf(arrayBuffer, { append = false, name = 'Dokument.pdf' } = {}) {
  const pdfjsLib = await pdfjsReady();
  const original = new Uint8Array(arrayBuffer.slice(0)); // Kopie: pdf.js entleert den Puffer
  const docId = newId();

  const task = pdfjsLib.getDocument({ data: new Uint8Array(arrayBuffer.slice(0)) });
  const pdf = await task.promise;
  pdfSources.set(docId, original);

  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const pg = await pdf.getPage(i);
    const base = pg.getViewport({ scale: 1 });
    let scale = 2;
    if (base.width * scale > MAX_RENDER_PX) scale = MAX_RENDER_PX / base.width;
    if (base.height * scale > MAX_RENDER_PX) scale = MAX_RENDER_PX / base.height;
    const vp = pg.getViewport({ scale });

    const c = makeCanvas(vp.width, vp.height);
    await pg.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;

    const p = createPage(vp.width, vp.height, '#ffffff');
    p.pdfSource = { docId, index: i - 1 };
    p.pdfPoints = { w: base.width, h: base.height };
    p.pdfRotate = (pg.rotate || 0) % 360;
    const layer = createLayer({ name: `PDF-Seite ${i}`, canvas: c });
    layer.pdfBase = true;
    p.layers.push(layer);
    p.activeLayerId = layer.id;
    pages.push(p);
  }

  if (append && state.pages.length) {
    state.pages.push(...pages);
    say(`${pages.length} Seite(n) angehängt`);
  } else {
    state.pages = pages;
    state.active = 0;
    state.name = name.replace(/\.pdf$/i, '');
    say(`${pages.length} Seite(n) geladen`);
  }
  notify();
  return pages.length;
}

/* ---------------- Seitenverwaltung ---------------- */

function addBlankPage(w, h) {
  commit('Seite anhängen');
  const cur = page();
  const p = createPage(w || cur?.width || 1240, h || cur?.height || 1754, '#ffffff');
  state.pages.push(p);
  state.active = state.pages.length - 1;
  notify();
}

function duplicatePage() {
  const p = page();
  if (!p) return;
  commit('Seite duplizieren');
  const copy = {
    ...p, id: newId(),
    layers: p.layers.map(l => ({ ...l, id: newId(), adjust: { ...l.adjust },
      text: l.text ? { ...l.text } : null, shape: l.shape ? { ...l.shape } : null })),
  };
  state.pages.splice(state.active + 1, 0, copy);
  state.active++;
  notify();
}

function deletePage() {
  if (state.pages.length <= 1) { say('Die letzte Seite lässt sich nicht löschen'); return; }
  commit('Seite löschen');
  state.pages.splice(state.active, 1);
  state.active = Math.min(state.active, state.pages.length - 1);
  notify();
}

/** Dreht die Seite um 90°; der Inhalt wird dabei auf eine Ebene reduziert. */
function rotatePage() {
  const p = page();
  if (!p) return;
  commit('Seite drehen');
  const flat = pageToCanvas(p, 1, true);
  const out = makeCanvas(flat.height, flat.width);
  const ctx = out.getContext('2d');
  ctx.translate(out.width / 2, out.height / 2);
  ctx.rotate(Math.PI / 2);
  ctx.drawImage(flat, -flat.width / 2, -flat.height / 2);

  p.width = out.width; p.height = out.height;
  if (p.pdfPoints) p.pdfPoints = { w: p.pdfPoints.h, h: p.pdfPoints.w };
  p.pdfSource = null; // gedrehte Seite wird beim Export neu gerastert
  const layer = createLayer({ name: 'Seite (gedreht)', canvas: out });
  p.layers = [layer];
  p.activeLayerId = layer.id;
  notify();
}

function movePage(from, to) {
  if (to < 0 || to >= state.pages.length) return;
  commit('Seiten umsortieren');
  const [p] = state.pages.splice(from, 1);
  state.pages.splice(to, 0, p);
  state.active = to;
  notify();
}

/* ---------------- Export ---------------- */

const STD_FONTS = [
  [/courier|mono/i, 'Courier'],
  [/times|georgia|garamond|serif/i, 'TimesRoman'],
];

function standardFontFor(t) {
  let base = 'Helvetica';
  for (const [re, name] of STD_FONTS) if (re.test(t.family)) { base = name; break; }
  const bold = Number(t.weight) >= 600;
  const italic = !!t.italic;
  if (base === 'TimesRoman') {
    if (bold && italic) return 'TimesRomanBoldItalic';
    if (bold) return 'TimesRomanBold';
    if (italic) return 'TimesRomanItalic';
    return 'TimesRoman';
  }
  const suffix = bold && italic ? 'BoldOblique' : bold ? 'Bold' : italic ? 'Oblique' : '';
  return base + suffix;
}

/** Textebene, die sich verlustfrei als echter PDF-Text schreiben lässt? */
function isVectorizableText(l) {
  return l.type === 'text' && l.visible && l.opacity > 0.99 &&
    Math.abs(l.rot) < 1e-6 && l.sx > 0 && l.sy > 0 &&
    Math.abs(l.sx - l.sy) < 1e-6 &&
    l.blend === 'source-over' && (!l.text.strokeWidth) &&
    /^[\x20-\x7E -ÿ\n]*$/.test(l.text.content || '');
}

function hexRgb(PDFLib, hex) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || '#000000');
  const v = m ? [1, 2, 3].map(i => parseInt(m[i], 16) / 255) : [0, 0, 0];
  return PDFLib.rgb(v[0], v[1], v[2]);
}

async function canvasToBytes(canvas, format, quality) {
  const type = format === 'jpeg' ? 'image/jpeg' : 'image/png';
  const blob = await new Promise(r => canvas.toBlob(r, type, quality));
  return new Uint8Array(await blob.arrayBuffer());
}

/** Seite ohne die Ausnahmeebenen rendern (transparentes Overlay). */
function overlayCanvas(p, skipIds, scale) {
  const clone = { ...p, bgColor: null, layers: p.layers.filter(l => !skipIds.has(l.id)) };
  if (!clone.layers.length) return null;
  return pageToCanvas(clone, scale, true);
}

/**
 * mode: 'hybrid' behält Originalseiten (Text bleibt Text) und stempelt Änderungen auf,
 *       'flat' rendert jede Seite komplett als Bild.
 */
async function exportPdf({ mode = 'hybrid', format = 'jpeg', quality = 0.9, scale = 1 } = {}) {
  const PDFLib = await pdfLibReady();
  const { PDFDocument, StandardFonts, degrees } = PDFLib;
  const out = await PDFDocument.create();
  const srcDocs = new Map();
  const fontCache = new Map();

  for (const p of state.pages) {
    let done = false;

    if (mode === 'hybrid' && p.pdfSource && pdfSources.has(p.pdfSource.docId) && !p.pdfRotate) {
      try {
        const key = p.pdfSource.docId;
        if (!srcDocs.has(key))
          srcDocs.set(key, await PDFDocument.load(pdfSources.get(key), { ignoreEncryption: true }));
        const base = p.layers.find(l => l.pdfBase);
        const baseUntouched = base && base.visible && base.opacity > 0.99 &&
          base.x === 0 && base.y === 0 && base.sx === 1 && base.sy === 1 && base.rot === 0;

        if (baseUntouched) {
          const [copied] = await out.copyPages(srcDocs.get(key), [p.pdfSource.index]);
          const pdfPage = out.addPage(copied);
          const pw = pdfPage.getWidth(), ph = pdfPage.getHeight();
          const k = pw / p.width; // Pixel -> Punkte

          const skip = new Set([base.id]);
          for (const l of p.layers) {
            if (!isVectorizableText(l)) continue;
            const t = l.text;
            const fontName = standardFontFor(t);
            if (!fontCache.has(fontName))
              fontCache.set(fontName, await out.embedFont(StandardFonts[fontName]));
            const font = fontCache.get(fontName);
            const size = t.size * l.sx * k;
            const pad = Math.ceil(t.size * 0.35 + t.strokeWidth * 2 + 4);
            const lines = String(t.content ?? '').split('\n');
            lines.forEach((line, i) => {
              const yDoc = l.y + (pad + t.size * t.lineHeight * i + t.size * 0.82) * l.sy;
              let xDoc = l.x + pad * l.sx;
              if (t.align !== 'left') {
                const wText = font.widthOfTextAtSize(line, size);
                const wBox = (l.canvas.width - pad * 2) * l.sx * k;
                xDoc += (t.align === 'center' ? (wBox - wText) / 2 : wBox - wText) / k;
              }
              pdfPage.drawText(line, {
                x: xDoc * k, y: ph - yDoc * k, size, font,
                color: hexRgb(PDFLib, t.color),
                ...(t.spacing ? { characterSpacing: t.spacing * l.sx * k } : {}),
              });
            });
            skip.add(l.id);
          }

          const ov = overlayCanvas(p, skip, scale);
          if (ov) {
            const img = await out.embedPng(await canvasToBytes(ov, 'png', 1));
            pdfPage.drawImage(img, { x: 0, y: 0, width: pw, height: ph });
          }
          done = true;
        }
      } catch (err) {
        console.warn('Originalseite konnte nicht übernommen, wird gerastert:', err);
      }
    }

    if (!done) {
      const canvas = pageToCanvas(p, scale, false);
      const bytes = await canvasToBytes(canvas, format, quality);
      const img = format === 'jpeg' ? await out.embedJpg(bytes) : await out.embedPng(bytes);
      const pw = (p.pdfPoints?.w) || p.width * PT_PER_PX;
      const ph = (p.pdfPoints?.h) || p.height * PT_PER_PX;
      const pdfPage = out.addPage([pw, ph]);
      pdfPage.drawImage(img, { x: 0, y: 0, width: pw, height: ph });
    }
  }

  out.setTitle(state.name || 'Bildwerk-Dokument');
  out.setProducer('Bildwerk');
  out.setCreator('Bildwerk – lokaler Bild- und PDF-Editor');
  return new Blob([await out.save()], { type: 'application/pdf' });
}

/* ================= ui.js ================= */
/* Bildwerk – Oberfläche: Bühne, Panels, Ebenenliste, Dialoge. */



const $ = (sel) => document.querySelector(sel);
const el = (tag, props = {}, kids = []) => {
  const n = Object.assign(document.createElement(tag), props);
  for (const k of [].concat(kids)) n.append(k);
  return n;
};

const canvas = () => $('#canvas');
const overlay = () => $('#overlay');
const thumbCache = new WeakMap();
let renderQueued = false;
let stripTimer = 0;

/* ---------------- Aufbau ---------------- */

function initUI() {
  buildToolbar();
  buildBlendSelect();
  buildAdjustments();
  buildFontSelect();
  bindPanels();
  bindStage();
  on('change', scheduleRender);
  on('status', (m) => { $('#status-msg').textContent = m || ''; });
  buildToolOptions();
}

function buildToolbar() {
  const bar = $('#toolbar');
  bar.textContent = '';
  for (const t of TOOLS) {
    const b = el('button', { className: 'tool', title: t.label, textContent: t.icon });
    b.dataset.tool = t.id;
    b.onclick = () => setTool(t.id);
    bar.append(b);
  }
  syncToolbar();
}

function setTool(id) {
  state.tool = id;
  if (id !== 'crop') clearCrop();
  syncToolbar();
  buildToolOptions();
  scheduleRender();
}

function syncToolbar() {
  document.querySelectorAll('.tool').forEach(b => b.classList.toggle('active', b.dataset.tool === state.tool));
  const cursors = { move: 'move', brush: 'crosshair', eraser: 'crosshair', bucket: 'crosshair',
    eyedrop: 'crosshair', text: 'text', select: 'crosshair', crop: 'crosshair', hand: 'grab' };
  $('#stage').style.cursor = cursors[state.tool] || 'crosshair';
}

function num(label, key, min, max, step, suffix = '') {
  const o = el('output', { textContent: fmt(opts[key], suffix) });
  const i = el('input', { type: 'range', min, max, step, value: opts[key] });
  i.oninput = () => { opts[key] = Number(i.value); o.textContent = fmt(opts[key], suffix); };
  return el('div', { className: 'opt' }, [el('span', { textContent: label }), i, o]);
}
const fmt = (v, s) => (Math.round(v * 100) / 100) + s;

function check(label, key) {
  const i = el('input', { type: 'checkbox', checked: !!opts[key] });
  i.onchange = () => { opts[key] = i.checked; };
  const l = el('label', { className: 'opt' }, [i, el('span', { textContent: label })]);
  return l;
}

function buildToolOptions() {
  const box = $('#tool-options');
  box.textContent = '';
  const t = state.tool;
  if (t === 'brush' || t === 'eraser') {
    box.append(num('Größe', 'size', 1, 400, 1, ' px'));
    box.append(num('Härte', 'hardness', 0, 1, 0.05));
    box.append(num('Deckkraft', 'flow', 0.02, 1, 0.02));
    box.append(hint('Alt-Taste malt mit der Hintergrundfarbe'));
  } else if (t === 'bucket') {
    box.append(num('Toleranz', 'tolerance', 0, 160, 1));
    box.append(hint('Mit aktiver Auswahl wird nur diese gefüllt'));
  } else if (t === 'text') {
    box.append(num('Schriftgröße', 'fontSize', 6, 400, 1, ' px'));
    box.append(hint('Auf die Bühne klicken, dann rechts unter „Schrift“ bearbeiten'));
  } else if (t === 'rect' || t === 'ellipse') {
    box.append(check('Gefüllt', 'fillShape'));
    box.append(num('Konturstärke', 'strokeWidth', 0, 60, 1, ' px'));
    if (t === 'rect') box.append(num('Eckenradius', 'radius', 0, 200, 1, ' px'));
  } else if (t === 'line') {
    box.append(num('Stärke', 'strokeWidth', 1, 60, 1, ' px'));
  } else if (t === 'crop') {
    box.append(hint('Bereich aufziehen, dann mit Eingabe bestätigen (Esc bricht ab)'));
  } else if (t === 'move') {
    box.append(hint('Ecken ziehen skaliert (Umschalt = proportional), der Punkt darüber dreht'));
  } else if (t === 'select') {
    box.append(hint('Entf leert die Auswahl, Strg+D hebt sie auf'));
  } else if (t === 'eyedrop') {
    box.append(hint('Klick nimmt die Vordergrundfarbe auf, Alt+Klick die Hintergrundfarbe'));
  } else if (t === 'hand') {
    box.append(hint('Ziehen verschiebt den Bildausschnitt'));
  }
}
const hint = (text) => el('div', { className: 'opt', textContent: text });

function buildBlendSelect() {
  const s = $('#l-blend');
  s.textContent = '';
  for (const [v, label] of BLEND_MODES) s.append(el('option', { value: v, textContent: label }));
  s.onchange = () => { const l = activeLayer(); if (!l) return; commit('Modus'); l.blend = s.value; notify(); };
}

function buildFontSelect() {
  const s = $('#t-family');
  s.textContent = '';
  for (const [v, label] of fontOptions()) s.append(el('option', { value: v, textContent: label }));
}
const refreshFontSelect = () => {
  const cur = $('#t-family').value;
  buildFontSelect();
  const l = activeLayer();
  $('#t-family').value = (l?.text?.family) || cur;
};

function buildAdjustments() {
  const box = $('#adjust-list');
  box.textContent = '';
  for (const d of ADJUSTMENTS) {
    const out = el('output', { textContent: d.def + d.unit });
    const inp = el('input', { type: 'range', min: d.min, max: d.max, step: 1, value: d.def });
    inp.dataset.adj = d.key;
    let started = false;
    inp.onpointerdown = () => { started = false; };
    inp.oninput = () => {
      const l = activeLayer();
      if (!l) return;
      if (!started) { commit('Anpassung'); started = true; }
      l.adjust[d.key] = Number(inp.value);
      out.textContent = inp.value + d.unit;
      notify();
    };
    inp.onchange = () => { started = false; };
    box.append(el('div', { className: 'adjust-row' }, [el('label', { textContent: d.label }), inp, out]));
  }
}

/* ---------------- Panels verdrahten ---------------- */

function bindPanels() {
  $('#fg-color').oninput = (e) => { state.fg = e.target.value; pushRecent(state.fg); notify(); };
  $('#bg-color').oninput = (e) => { state.bg = e.target.value; notify(); };

  $('#l-opacity').oninput = (e) => {
    const l = activeLayer(); if (!l) return;
    l.opacity = Number(e.target.value) / 100;
    $('#op-val').textContent = e.target.value + '%';
    notify();
  };
  $('#l-opacity').onpointerdown = () => { if (activeLayer()) commit('Deckkraft'); };

  const textFields = {
    't-content': 'content', 't-family': 'family', 't-size': 'size', 't-weight': 'weight',
    't-line': 'lineHeight', 't-spacing': 'spacing', 't-align': 'align', 't-color': 'color',
    't-stroke': 'stroke', 't-strokew': 'strokeWidth', 't-italic': 'italic',
  };
  for (const [id, key] of Object.entries(textFields)) {
    const node = $('#' + id);
    let armed = false;
    node.addEventListener('focus', () => { armed = false; });
    node.addEventListener('input', () => {
      const l = activeLayer();
      if (!l || l.type !== 'text') return;
      if (!armed) { commit('Text ändern'); armed = true; }
      let v = node.type === 'checkbox' ? node.checked : node.value;
      if (['size', 'lineHeight', 'spacing', 'strokeWidth'].includes(key)) v = Number(v);
      l.text[key] = v;
      refreshLayer(l);
      notify();
    });
    node.addEventListener('change', () => { armed = false; });
  }
}

function pushRecent(hex) {
  if (state.recentColors[0] === hex) return;
  state.recentColors = [hex, ...state.recentColors.filter(c => c !== hex)].slice(0, 12);
}

/* ---------------- Bühne ---------------- */

function stagePoint(ev) {
  const r = canvas().getBoundingClientRect();
  return { x: (ev.clientX - r.left) / state.zoom, y: (ev.clientY - r.top) / state.zoom };
}

function bindStage() {
  const stage = $('#stage');
  let panning = null;

  stage.addEventListener('pointerdown', (ev) => {
    if (!page()) return;
    if (ev.button === 1 || state.tool === 'hand' || (ev.button === 0 && ev.spaceKey)) {
      const wrap = $('#stage-wrap');
      panning = { x: ev.clientX, y: ev.clientY, l: wrap.scrollLeft, t: wrap.scrollTop };
      stage.style.cursor = 'grabbing';
      stage.setPointerCapture(ev.pointerId);
      return;
    }
    if (ev.button !== 0) return;
    stage.setPointerCapture(ev.pointerId);
    pointerDown(stagePoint(ev), ev);
  });

  stage.addEventListener('pointermove', (ev) => {
    const p = stagePoint(ev);
    $('#status-pos').textContent = page() ? `x ${Math.round(p.x)}  y ${Math.round(p.y)}` : '';
    if (panning) {
      const wrap = $('#stage-wrap');
      wrap.scrollLeft = panning.l - (ev.clientX - panning.x);
      wrap.scrollTop = panning.t - (ev.clientY - panning.y);
      return;
    }
    pointerMove(p, ev);
  });

  const end = (ev) => {
    if (panning) { panning = null; syncToolbar(); return; }
    pointerUp(stagePoint(ev), ev);
  };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);

  $('#stage-wrap').addEventListener('wheel', (ev) => {
    if (!ev.ctrlKey) return;
    ev.preventDefault();
    setZoom(state.zoom * (ev.deltaY < 0 ? 1.12 : 1 / 1.12));
  }, { passive: false });
}

function setZoom(z) {
  // Oberhalb der Browsergrenze fuer Canvas bliebe die Buehne leer,
  // deshalb wird die Vergroesserung an der Dokumentgroesse gedeckelt.
  const max = maxZoomFor(page());
  const ziel = Math.max(0.02, z);
  if (ziel > max && state.zoom >= max - 1e-6)
    say(`Mehr als ${Math.round(max * 100)}% laesst die Bildflaeche bei dieser Dokumentgroesse nicht zu`);
  state.zoom = Math.min(max, ziel);
  scheduleRender();
}

function fitZoom() {
  const p = page();
  if (!p) return;
  const wrap = $('#stage-wrap');
  const pad = 52;
  setZoom(Math.min((wrap.clientWidth - pad) / p.width, (wrap.clientHeight - pad) / p.height, 4));
  scheduleRender();
}

/* ---------------- Rendering ---------------- */

function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; renderAll(); });
}

function renderAll() {
  const p = page();
  const c = canvas(), o = overlay();
  if (!p) return;
  const w = Math.round(p.width * state.zoom), h = Math.round(p.height * state.zoom);
  for (const cv of [c, o]) {
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    cv.style.width = w + 'px';
    cv.style.height = h + 'px';
  }
  $('#stage').style.width = w + 'px';
  $('#stage').style.height = h + 'px';

  renderPage(p, c.getContext('2d'), { scale: state.zoom });
  drawOverlay(o.getContext('2d'));

  syncPanels();
  renderLayerList();
  renderRecentColors();
  renderPageStrip();

  $('#zoom-label').textContent = Math.round(state.zoom * 100) + '%';
  $('#status-doc').textContent =
    `${state.name} · ${p.width}×${p.height} px · Seite ${state.active + 1}/${state.pages.length} · ${p.layers.length} Ebene(n)`;
}

function syncPanels() {
  const l = activeLayer();
  $('#fg-color').value = state.fg;
  $('#bg-color').value = state.bg;

  const isText = !!l && l.type === 'text';
  $('#panel-text').hidden = !isText;
  if (isText && document.activeElement?.id?.startsWith('t-') !== true) {
    const t = l.text;
    $('#t-content').value = t.content;
    $('#t-family').value = t.family;
    $('#t-size').value = t.size;
    $('#t-weight').value = t.weight;
    $('#t-line').value = t.lineHeight;
    $('#t-spacing').value = t.spacing;
    $('#t-align').value = t.align;
    $('#t-color').value = t.color;
    $('#t-stroke').value = t.stroke;
    $('#t-strokew').value = t.strokeWidth;
    $('#t-italic').checked = t.italic;
  }

  if (l) {
    $('#l-opacity').value = Math.round(l.opacity * 100);
    $('#op-val').textContent = Math.round(l.opacity * 100) + '%';
    $('#l-blend').value = l.blend;
    for (const d of ADJUSTMENTS) {
      const inp = document.querySelector(`input[data-adj="${d.key}"]`);
      if (inp && document.activeElement !== inp) {
        inp.value = l.adjust[d.key];
        inp.nextElementSibling.textContent = l.adjust[d.key] + d.unit;
      }
    }
  }
}

function thumbFor(layer) {
  let url = thumbCache.get(layer.canvas);
  if (!url) {
    const S = 32;
    const t = document.createElement('canvas');
    t.width = t.height = S;
    const s = Math.min(S / layer.canvas.width, S / layer.canvas.height);
    const w = Math.max(1, layer.canvas.width * s), h = Math.max(1, layer.canvas.height * s);
    t.getContext('2d').drawImage(layer.canvas, (S - w) / 2, (S - h) / 2, w, h);
    url = t.toDataURL();
    thumbCache.set(layer.canvas, url);
  }
  return url;
}

function renderLayerList() {
  const box = $('#layer-list');
  const act = activeLayer();
  box.textContent = '';
  for (const l of [...layers()].reverse()) {
    const row = el('div', { className: 'layer' + (l === act ? ' active' : '') + (l.visible ? '' : ' hidden-layer') });
    const eye = el('button', { className: 'eye', textContent: l.visible ? '👁' : '—', title: 'Sichtbarkeit' });
    eye.onclick = (e) => { e.stopPropagation(); commit('Sichtbarkeit'); l.visible = !l.visible; notify(); };
    const img = el('img', { className: 'thumb', src: thumbFor(l) });
    const name = el('div', { className: 'name', textContent: l.name });
    name.ondblclick = () => {
      const inp = el('input', { type: 'text', value: l.name });
      name.textContent = ''; name.append(inp); inp.focus(); inp.select();
      const done = () => { commit('Umbenennen'); l.name = inp.value || l.name; notify(); };
      inp.onblur = done;
      inp.onkeydown = (e) => { if (e.key === 'Enter') inp.blur(); };
    };
    row.append(eye, img, name);
    if (l.type !== 'raster') row.append(el('span', { className: 'badge', textContent: l.type === 'text' ? 'T' : '◇' }));
    row.onclick = () => { setActiveLayer(l.id); notify(); };
    box.append(row);
  }
}

function renderRecentColors() {
  const box = $('#recent-colors');
  box.textContent = '';
  for (const c of state.recentColors) {
    const b = el('button', { title: c });
    b.style.background = c;
    b.onclick = () => { state.fg = c; notify(); };
    box.append(b);
  }
}

function renderPageStrip() {
  const strip = $('#pagestrip');
  strip.hidden = state.pages.length < 2;
  if (strip.hidden) return;
  clearTimeout(stripTimer);
  stripTimer = setTimeout(() => {
    strip.textContent = '';
    state.pages.forEach((p, i) => {
      const btn = el('button', { className: 'pagethumb' + (i === state.active ? ' active' : ''), title: `Seite ${i + 1}` });
      const c = document.createElement('canvas');
      const s = 62 / p.width;
      c.width = 62; c.height = Math.max(1, Math.round(p.height * s));
      renderPage(p, c.getContext('2d'), { scale: s });
      btn.append(c, el('span', { textContent: i + 1 }));
      btn.onclick = () => { state.active = i; state.selection = null; notify(); };
      strip.append(btn);
    });
  }, 220);
}

/* ---------------- Dialoge ---------------- */

function modal(title, fields, { okLabel = 'OK', text = '' } = {}) {
  return new Promise(resolve => {
    const back = $('#modal'), body = $('#modal-body');
    $('#modal-title').textContent = title;
    body.textContent = '';
    if (text) body.append(el('p', { innerHTML: text }));

    const inputs = {};
    for (const f of fields || []) {
      const wrap = el('div', { className: 'field' });
      wrap.append(el('label', { textContent: f.label }));
      let inp;
      if (f.type === 'select') {
        inp = el('select');
        for (const [v, l] of f.options) inp.append(el('option', { value: v, textContent: l }));
        inp.value = f.value;
      } else if (f.type === 'checkbox') {
        inp = el('input', { type: 'checkbox', checked: !!f.value });
      } else {
        inp = el('input', { type: f.type || 'text', value: f.value ?? '' });
        if (f.min != null) inp.min = f.min;
        if (f.max != null) inp.max = f.max;
        if (f.step != null) inp.step = f.step;
      }
      inputs[f.key] = inp;
      wrap.append(inp);
      body.append(wrap);
    }

    $('#modal-ok').textContent = okLabel;
    back.hidden = false;
    setTimeout(() => Object.values(inputs)[0]?.focus(), 30);

    const close = (result) => {
      back.hidden = true;
      $('#modal-ok').onclick = null;
      $('#modal-cancel').onclick = null;
      back.onkeydown = null;
      resolve(result);
    };
    const accept = () => {
      const out = {};
      for (const [k, i] of Object.entries(inputs))
        out[k] = i.type === 'checkbox' ? i.checked : (i.type === 'number' ? Number(i.value) : i.value);
      close(out);
    };
    $('#modal-ok').onclick = accept;
    $('#modal-cancel').onclick = () => close(null);
    back.onkeydown = (e) => {
      if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') accept();
      if (e.key === 'Escape') close(null);
    };
  });
}

/** Fortschrittsanzeige ueber der Buehne; liefert update/schliessen + Abbruch. */
function showProgress(titel) {
  const box = $('#progress');
  const ctrl = new AbortController();
  $('#progress-title').textContent = titel;
  $('#progress-fill').style.width = '0%';
  $('#progress-pct').textContent = '0 %';
  $('#progress-cancel').onclick = () => {
    ctrl.abort();
    $('#progress-pct').textContent = 'wird abgebrochen…';
  };
  box.hidden = false;
  return {
    signal: ctrl.signal,
    update(v) {
      const pct = Math.round(Math.min(1, Math.max(0, v)) * 100);
      $('#progress-fill').style.width = pct + '%';
      if (!ctrl.signal.aborted) $('#progress-pct').textContent = pct + ' %';
    },
    close() { box.hidden = true; $('#progress-cancel').onclick = null; },
  };
}

function info(title, html) {
  return modal(title, [], { okLabel: 'Schließen', text: html });
}


/* Namensraeume, die im Modulbetrieb aus `import * as ...` stammen */
const F = { bakeAdjust, convolve, sharpen, edges, emboss, softBlur, pixelate,
  noise, posterize, threshold, autoLevel, vignette, flip, rotate90,
  floodFill, hexToRgb, rgbToHex };
const PDF = { pdfSources, pdfjsReady, pdfLibReady, importPdf, addBlankPage,
  duplicatePage, deletePage, rotatePage, movePage, exportPdf };

/* ================= commands.js ================= */

/* ---------------- Datei-Hilfen ---------------- */

function pickFile(accept, multiple = false) {
  return new Promise(resolve => {
    const inp = document.querySelector('#file-input');
    inp.value = '';
    inp.accept = accept;
    inp.multiple = multiple;
    inp.onchange = () => resolve(multiple ? [...inp.files] : inp.files[0] || null);
    inp.click();
  });
}

function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function loadImage(src) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = rej;
    img.src = src;
  });
}

async function fileToImage(file) {
  const url = URL.createObjectURL(file);
  try { return await loadImage(url); } finally { setTimeout(() => URL.revokeObjectURL(url), 2000); }
}

function imageToCanvas(img) {
  const c = makeCanvas(img.naturalWidth || img.width, img.naturalHeight || img.height);
  c.getContext('2d').drawImage(img, 0, 0);
  return c;
}

/* ---------------- Dokument ---------------- */

function newDocument(w, h, transparent) {
  state.pages = [createPage(w, h, transparent ? null : '#ffffff')];
  state.active = 0;
  state.selection = null;
  state.sourcePdfBytes = null;
  PDF.pdfSources.clear();
  resetHistory();
  const p = page();
  const base = createLayer({ name: 'Hintergrund', w: p.width, h: p.height });
  p.layers.push(base);
  p.activeLayerId = base.id;
  state.dirty = false;
  notify();
  fitZoom();
}

async function openImageAsDocument(file) {
  const img = await fileToImage(file);
  const c = imageToCanvas(img);
  state.pages = [createPage(c.width, c.height, null)];
  state.active = 0;
  state.name = file.name.replace(/\.[^.]+$/, '');
  PDF.pdfSources.clear();
  resetHistory();
  const p = page();
  const l = createLayer({ name: file.name, canvas: c });
  p.layers.push(l);
  p.activeLayerId = l.id;
  state.dirty = false;
  say(`${file.name} geöffnet (${c.width}×${c.height})`);
  notify();
  fitZoom();
}

async function placeImage(file) {
  const img = await fileToImage(file);
  const c = imageToCanvas(img);
  commit('Bild einfügen');
  const p = page();
  const l = createLayer({ name: file.name, canvas: c });
  const s = Math.min(1, p.width / c.width, p.height / c.height);
  l.sx = l.sy = s;
  l.x = (p.width - c.width * s) / 2;
  l.y = (p.height - c.height * s) / 2;
  addLayer(l);
  say(`${file.name} als Ebene eingefügt`);
  notify();
}

/** Datei, die auf das Fenster gezogen wurde: nach Typ einsortieren. */
async function handleDroppedFile(file) {
  if (file.type === 'application/pdf') {
    say('PDF wird geladen …');
    await PDF.importPdf(await file.arrayBuffer(), { name: file.name, append: state.pages.length > 1 });
    resetHistory();
    fitZoom();
  } else if (/^image\//.test(file.type)) {
    if (state.pages.length === 1 && layers().length === 1 && !state.dirty)
      await openImageAsDocument(file);
    else
      await placeImage(file);
  } else if (/\.bildwerk$/i.test(file.name)) {
    await openProject(file);
  } else {
    say('Dateityp wird nicht unterstützt: ' + (file.type || file.name));
  }
}

/* ---------------- Ebenenoperationen ---------------- */

function ensureRaster(l) {
  if (l.type === 'raster') return;
  l.type = 'raster';
  l.text = null;
  l.shape = null;
}

function applyPixelOp(fn, label) {
  const l = activeLayer();
  if (!l) { say('Keine Ebene ausgewählt'); return; }
  commit(label);
  ensureRaster(l);
  l.canvas = fn(l.canvas);
  notify();
  say(label + ' angewendet');
}

/** Ebenen in ein gemeinsames Canvas zeichnen, das ihren ganzen Inhalt fasst.
 *  Ohne diesen Rahmen ginge alles verloren, was ueber die Leinwand ragt. */
function combineLayers(list, { withPage = null, name = 'Ebene' } = {}) {
  const b = unionBounds(list, withPage);
  const fit = fitCanvasSize(b.w, b.h);
  const beschnitten = fit.scale < 1;
  const c = makeCanvas(b.w, b.h);
  const ctx = c.getContext('2d');
  ctx.translate(-b.x, -b.y);
  if (withPage && withPage.bgColor) {
    ctx.fillStyle = withPage.bgColor;
    ctx.fillRect(0, 0, withPage.width, withPage.height);
  }
  for (const layer of list) drawLayer(ctx, layer);
  const merged = createLayer({ name, canvas: c });
  merged.x = b.x;
  merged.y = b.y;
  if (beschnitten) say('Hinweis: Der Inhalt war groesser als eine Leinwand fassen kann');
  return merged;
}

function mergeDown() {
  const p = page();
  const l = activeLayer();
  const i = p.layers.indexOf(l);
  if (i < 1) { say('Darunter liegt keine Ebene'); return; }
  commit('Ebenen vereinen');
  const below = p.layers[i - 1];
  const merged = combineLayers([below, l], { name: below.name });
  p.layers.splice(i - 1, 2, merged);
  p.activeLayerId = merged.id;
  notify();
  say('Ebenen vereint – auch was ueber die Leinwand ragt, bleibt erhalten');
}

function flattenPage() {
  const p = page();
  commit('Auf Hintergrund reduzieren');
  const merged = combineLayers(p.layers.filter(x => x.visible), { withPage: p, name: 'Hintergrund' });
  p.layers = [merged];
  p.activeLayerId = merged.id;
  notify();
}

/** Leinwand so vergroessern, dass jede Ebene vollstaendig darauf liegt. */
function canvasToContent() {
  const p = page();
  const b = unionBounds(p.layers, p);
  if (b.x === 0 && b.y === 0 && b.w === p.width && b.h === p.height) {
    say('Alle Ebenen liegen bereits vollstaendig auf der Leinwand');
    return;
  }
  commit('Leinwand auf Inhalt erweitern');
  for (const layer of p.layers) { layer.x -= b.x; layer.y -= b.y; }
  p.width = b.w;
  p.height = b.h;
  p.pdfSource = null;
  p.pdfPoints = null;
  notify();
  fitZoom();
  say(`Leinwand auf ${b.w}x${b.h} erweitert`);
}

function moveLayer(dir) {
  const p = page();
  const l = activeLayer();
  const i = p.layers.indexOf(l);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= p.layers.length) return;
  commit('Ebene umsortieren');
  p.layers.splice(j, 0, p.layers.splice(i, 1)[0]);
  notify();
}

function cropTo(rect) {
  const p = page();
  const r = {
    x: Math.max(0, Math.round(rect.x)), y: Math.max(0, Math.round(rect.y)),
    w: Math.round(rect.w), h: Math.round(rect.h),
  };
  if (r.w < 2 || r.h < 2) { say('Der Bereich ist zu klein'); return; }
  commit('Zuschneiden');
  for (const l of p.layers) { l.x -= r.x; l.y -= r.y; }
  p.width = Math.min(r.w, 20000);
  p.height = Math.min(r.h, 20000);
  p.pdfSource = null;
  p.pdfPoints = null;
  state.selection = null;
  clearCrop();
  notify();
  fitZoom();
  say(`Zugeschnitten auf ${p.width}×${p.height}`);
}

function scaleDocument(factor) {
  const p = page();
  commit('Bildgröße');
  for (const l of p.layers) {
    l.x *= factor; l.y *= factor; l.sx *= factor; l.sy *= factor;
  }
  p.width = Math.round(p.width * factor);
  p.height = Math.round(p.height * factor);
  p.pdfSource = null;
  notify();
  fitZoom();
}

/** Inhaltsbasiert skalieren: Dialog, Fortschritt, Anwendung auf die Ebene. */
async function contentAwareDialog() {
  const l = activeLayer();
  if (!l) { say('Keine Ebene ausgewaehlt'); return; }
  const w = l.canvas.width, h = l.canvas.height;
  if (w * h > maxPixels) {
    await info('Inhaltsbasiert skalieren',
      `Diese Ebene hat ${(w * h / 1e6).toFixed(1)} Megapixel. Das Verfahren rechnet ` +
      `Pfad fuer Pfad durch das Bild und waere hier zu langsam. Bitte die Ebene ` +
      `zuerst ueber „Bearbeiten &rarr; Bildgroesse skalieren“ auf hoechstens ` +
      `${maxPixels / 1e6} Megapixel bringen.`);
    return;
  }

  const hatAuswahl = !!state.selection;
  const r = await modal('Inhaltsbasiert skalieren', [
    { key: 'w', label: `Neue Breite in Pixeln (jetzt ${w})`, type: 'number', value: w, min: 8, max: w * 2 },
    { key: 'h', label: `Neue Hoehe in Pixeln (jetzt ${h})`, type: 'number', value: h, min: 8, max: h * 2 },
    ...(hatAuswahl ? [{ key: 'schutz', label: 'Ausgewaehlten Bereich schuetzen', type: 'checkbox', value: true }] : []),
  ], { okLabel: 'Skalieren', text:
    'Ruhige Bildbereiche geben nach, Motive behalten ihre Form. ' +
    'Am besten funktioniert das bei Aenderungen bis etwa 30 Prozent.' +
    (hatAuswahl ? ' Der ausgewaehlte Bereich kann dabei geschuetzt werden.' : '') });
  if (!r) return;
  if (r.w === w && r.h === h) { say('Groesse unveraendert'); return; }

  // Auswahl von Dokument- in Ebenenkoordinaten bringen
  let schutz = null;
  if (r.schutz && state.selection) {
    const s = state.selection;
    const a = docToLayer(l, s.x, s.y);
    const b = docToLayer(l, s.x + s.w, s.y + s.h);
    schutz = { x: Math.min(a.x, b.x), y: Math.min(a.y, b.y),
               w: Math.abs(b.x - a.x), h: Math.abs(b.y - a.y) };
  }

  const p2 = page();
  // Deckt die Ebene die Leinwand genau ab, wird diese mitskaliert
  const fuelltLeinwand = l.x === 0 && l.y === 0 && l.rot === 0 && l.sx === 1 && l.sy === 1 &&
    l.canvas.width === p2.width && l.canvas.height === p2.height;

  commit('Inhaltsbasiert skalieren');
  ensureRaster(l);
  const fortschritt = showProgress('Inhaltsbasiert skalieren');
  try {
    const neu = await contentAwareResize(l.canvas, r.w, r.h, {
      schutz,
      signal: fortschritt.signal,
      onProgress: (t) => fortschritt.update(t),
    });
    if (fuelltLeinwand) {
      // Wer das ganze Bild skaliert, erwartet eine mitgehende Leinwand
      l.canvas = neu;
      l.x = 0; l.y = 0;
      p2.width = neu.width;
      p2.height = neu.height;
      p2.pdfSource = null;
      p2.pdfPoints = null;
      fitZoom();
    } else {
      // Sonst bleibt die Bildmitte stehen, damit die Ebene nicht springt
      const mx = l.x + (l.canvas.width * l.sx) / 2;
      const my = l.y + (l.canvas.height * l.sy) / 2;
      l.canvas = neu;
      l.x = mx - (neu.width * l.sx) / 2;
      l.y = my - (neu.height * l.sy) / 2;
    }
    notify();
    say(`Inhaltsbasiert skaliert: ${w}x${h} auf ${neu.width}x${neu.height}`);
  } catch (err) {
    undo();
    notify();
    say(err.message === 'abgebrochen' ? 'Abgebrochen – die Ebene bleibt unveraendert'
                                      : 'Fehlgeschlagen: ' + err.message);
  } finally {
    fortschritt.close();
  }
}

/* ---------------- Projektdatei ---------------- */

async function saveProject() {
  const data = {
    format: 'bildwerk/1',
    name: state.name,
    fonts: serializeFonts(),
    pages: state.pages.map(p => ({
      width: p.width, height: p.height, bgColor: p.bgColor,
      activeLayerId: p.activeLayerId,
      layers: p.layers.map(l => ({
        id: l.id, name: l.name, type: l.type, visible: l.visible, opacity: l.opacity,
        blend: l.blend, x: l.x, y: l.y, rot: l.rot, sx: l.sx, sy: l.sy,
        adjust: l.adjust, text: l.text, shape: l.shape,
        image: l.type === 'raster' ? l.canvas.toDataURL('image/png') : null,
      })),
    })),
  };
  download(new Blob([JSON.stringify(data)], { type: 'application/json' }),
    (state.name || 'projekt') + '.bildwerk');
  state.dirty = false;
  say('Projekt gespeichert');
}

async function openProject(file) {
  const data = JSON.parse(await file.text());
  if (data.format !== 'bildwerk/1') throw new Error('Unbekanntes Projektformat');
  await restoreFonts(data.fonts);
  const pages = [];
  for (const sp of data.pages) {
    const p = createPage(sp.width, sp.height, sp.bgColor);
    for (const sl of sp.layers) {
      const l = createLayer({ name: sl.name, type: sl.type });
      Object.assign(l, {
        visible: sl.visible, opacity: sl.opacity, blend: sl.blend,
        x: sl.x, y: sl.y, rot: sl.rot, sx: sl.sx, sy: sl.sy,
        adjust: { ...defaultAdjust(), ...sl.adjust }, text: sl.text, shape: sl.shape,
      });
      if (sl.image) l.canvas = imageToCanvas(await loadImage(sl.image));
      else refreshLayer(l);
      p.layers.push(l);
    }
    p.activeLayerId = p.layers[p.layers.length - 1]?.id ?? null;
    pages.push(p);
  }
  state.pages = pages;
  state.active = 0;
  state.name = data.name || 'Projekt';
  resetHistory();
  refreshFontSelect();
  notify();
  fitZoom();
  say('Projekt geladen');
}

/* ---------------- Export ---------------- */

async function exportImage(type, quality) {
  const p = page();
  const c = pageToCanvas(p, 1, type === 'image/png' || type === 'image/webp' ? !p.bgColor : false);
  const blob = await new Promise(r => c.toBlob(r, type, quality));
  const ext = type.split('/')[1].replace('jpeg', 'jpg');
  download(blob, `${state.name || 'bild'}.${ext}`);
  say(`Exportiert als ${ext.toUpperCase()} (${c.width}×${c.height})`);
}

async function exportPdfDialog() {
  const res = await modal('Als PDF exportieren', [
    { key: 'mode', label: 'Modus', type: 'select', value: 'hybrid', options: [
      ['hybrid', 'Original beibehalten, Änderungen aufsetzen'],
      ['flat', 'Alles als Bild rastern'],
    ] },
    { key: 'format', label: 'Bildkompression der gerasterten Seiten', type: 'select', value: 'jpeg', options: [
      ['jpeg', 'JPEG (klein)'], ['png', 'PNG (verlustfrei, groß)'],
    ] },
    { key: 'quality', label: 'JPEG-Qualität (0,1–1,0)', type: 'number', value: 0.9, min: 0.1, max: 1, step: 0.05 },
  ], { okLabel: 'Exportieren', text:
    'Im ersten Modus bleiben Text und Vektoren geöffneter PDFs erhalten; ' +
    'neue Textebenen werden – wo möglich – als echter PDF-Text geschrieben.' });
  if (!res) return;
  say('PDF wird erzeugt …');
  const blob = await PDF.exportPdf({ mode: res.mode, format: res.format, quality: res.quality });
  download(blob, `${state.name || 'dokument'}.pdf`);
  say(`PDF mit ${state.pages.length} Seite(n) exportiert`);
}

/* ---------------- Befehlsverteiler ---------------- */

async function run(cmd) {
  const p = page();
  const l = activeLayer();

  switch (cmd) {
    /* --- Datei --- */
    case 'new': {
      const r = await modal('Neues Dokument', [
        { key: 'w', label: 'Breite (px)', type: 'number', value: p?.width || 1600, min: 1, max: 20000 },
        { key: 'h', label: 'Höhe (px)', type: 'number', value: p?.height || 1000, min: 1, max: 20000 },
        { key: 'transparent', label: 'Transparenter Hintergrund', type: 'checkbox', value: false },
      ], { okLabel: 'Anlegen' });
      if (r) { state.name = 'Unbenannt'; newDocument(r.w, r.h, r.transparent); }
      break;
    }
    case 'open-image': {
      const f = await pickFile('image/*');
      if (f) await openImageAsDocument(f);
      break;
    }
    case 'place-image': {
      const f = await pickFile('image/*');
      if (f) await placeImage(f);
      break;
    }
    case 'open-pdf': {
      const f = await pickFile('application/pdf');
      if (f) { say('PDF wird geladen …'); await PDF.importPdf(await f.arrayBuffer(), { name: f.name }); resetHistory(); fitZoom(); }
      break;
    }
    case 'pdf-append': {
      const f = await pickFile('application/pdf');
      if (f) { commit('PDF anhängen'); await PDF.importPdf(await f.arrayBuffer(), { append: true, name: f.name }); }
      break;
    }
    case 'save-project': await saveProject(); break;
    case 'open-project': {
      const f = await pickFile('.bildwerk,application/json');
      if (f) await openProject(f);
      break;
    }
    case 'export-png': await exportImage('image/png'); break;
    case 'export-webp': await exportImage('image/webp', 0.92); break;
    case 'export-jpg': {
      const r = await modal('JPEG exportieren', [
        { key: 'q', label: 'Qualität (0,1–1,0)', type: 'number', value: 0.92, min: 0.1, max: 1, step: 0.02 },
      ], { okLabel: 'Exportieren' });
      if (r) await exportImage('image/jpeg', r.q);
      break;
    }
    case 'export-pdf': await exportPdfDialog(); break;

    /* --- Bearbeiten --- */
    case 'undo': if (undo()) { notify(); say('Rückgängig'); } else say('Nichts zum Rückgängigmachen'); break;
    case 'redo': if (redo()) { notify(); say('Wiederholt'); } else say('Nichts zum Wiederholen'); break;
    case 'copy-layer': {
      if (!l) break;
      commit('Ebene duplizieren');
      const copy = createLayer({ name: l.name + ' Kopie', type: l.type });
      Object.assign(copy, {
        visible: l.visible, opacity: l.opacity, blend: l.blend,
        // Deckungsgleich wie in anderen Editoren: kein Versatz, sonst
        // ragt die Kopie ueber die Leinwand und verliert dort Inhalt.
        x: l.x, y: l.y, rot: l.rot, sx: l.sx, sy: l.sy,
        adjust: { ...l.adjust }, text: l.text ? { ...l.text } : null,
        shape: l.shape ? { ...l.shape } : null,
        // Die Bilddaten werden geteilt; beginPixelEdit legt vor der ersten
        // Pixelaenderung automatisch eine eigene Kopie an.
        canvas: l.canvas,
      });
      copy.pdfBase = false;
      addLayer(copy);
      notify();
      say('Ebene dupliziert (deckungsgleich)');
      break;
    }
    case 'delete-layer': {
      if (!l) break;
      if (layers().length <= 1) { say('Die letzte Ebene lässt sich nicht löschen'); break; }
      commit('Ebene löschen');
      removeLayer(l.id);
      notify();
      break;
    }
    case 'clear-selection': {
      if (!l || !state.selection) { say('Keine Auswahl'); break; }
      commit('Auswahl leeren');
      const ctx = beginPixelEdit(l);
      const s = state.selection;
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      const m = layerMatrix(l).inverse();
      const pts = [[s.x, s.y], [s.x + s.w, s.y], [s.x + s.w, s.y + s.h], [s.x, s.y + s.h]]
        .map(([x, y]) => m.transformPoint(new DOMPoint(x, y)));
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      pts.slice(1).forEach(q => ctx.lineTo(q.x, q.y));
      ctx.closePath();
      ctx.clip();
      ctx.clearRect(0, 0, l.canvas.width, l.canvas.height);
      ctx.restore();
      notify();
      break;
    }
    case 'select-none': state.selection = null; clearCrop(); notify(); break;
    case 'canvas-to-content': canvasToContent(); break;
    case 'content-aware-scale': await contentAwareDialog(); break;
    case 'crop-to-selection': {
      const r = getCropRect() || state.selection;
      if (!r) { say('Erst einen Bereich auswählen'); break; }
      cropTo(r);
      break;
    }
    case 'resize-doc': {
      const r = await modal('Dokumentgröße (Leinwand)', [
        { key: 'w', label: 'Breite (px)', type: 'number', value: p.width, min: 1, max: 20000 },
        { key: 'h', label: 'Höhe (px)', type: 'number', value: p.height, min: 1, max: 20000 },
      ], { okLabel: 'Ändern', text: 'Die Ebenen behalten ihre Größe und Position.' });
      if (!r) break;
      commit('Dokumentgröße');
      p.width = r.w; p.height = r.h; p.pdfSource = null;
      notify(); fitZoom();
      break;
    }
    case 'resize-image': {
      const r = await modal('Bildgröße skalieren', [
        { key: 'w', label: 'Neue Breite (px)', type: 'number', value: p.width, min: 1, max: 20000 },
      ], { okLabel: 'Skalieren', text: 'Seitenverhältnis und alle Ebenen werden mitskaliert.' });
      if (!r) break;
      scaleDocument(r.w / p.width);
      break;
    }

    /* --- Ebene --- */
    case 'add-layer': {
      commit('Neue Ebene');
      addLayer(createLayer({ name: 'Ebene ' + (layers().length + 1), w: p.width, h: p.height }));
      notify();
      break;
    }
    case 'add-text': {
      commit('Textebene');
      const t = defaultText('Neuer Text');
      t.size = opts.fontSize; t.color = state.fg;
      const layer = createLayer({ name: 'Text', type: 'text', text: t });
      refreshLayer(layer);
      layer.x = p.width / 2 - layer.canvas.width / 2;
      layer.y = p.height / 2 - layer.canvas.height / 2;
      addLayer(layer);
      setTool('move');
      notify();
      break;
    }
    case 'merge-down': mergeDown(); break;
    case 'flatten': flattenPage(); break;
    case 'layer-up': moveLayer(1); break;
    case 'layer-down': moveLayer(-1); break;
    case 'fit-layer': {
      if (!l) break;
      commit('Ebene einpassen');
      const s = Math.min(p.width / l.canvas.width, p.height / l.canvas.height);
      l.sx = l.sy = s; l.rot = 0;
      l.x = (p.width - l.canvas.width * s) / 2;
      l.y = (p.height - l.canvas.height * s) / 2;
      notify();
      break;
    }
    case 'reset-transform': {
      if (!l) break;
      commit('Transformation zurücksetzen');
      l.rot = 0; l.sx = 1; l.sy = 1;
      notify();
      break;
    }
    case 'rasterize-text': {
      if (!l || l.type === 'raster') { say('Diese Ebene ist bereits gerastert'); break; }
      commit('Rastern');
      ensureRaster(l);
      notify();
      say('Ebene gerastert');
      break;
    }

    /* --- Farben & Anpassungen --- */
    case 'swap-colors': { const t = state.fg; state.fg = state.bg; state.bg = t; notify(); break; }
    case 'reset-adjust': {
      if (!l) break;
      commit('Anpassungen zurücksetzen');
      l.adjust = defaultAdjust();
      notify();
      break;
    }
    case 'bake-adjust': {
      if (!l) break;
      commit('Anpassungen einrechnen');
      ensureRaster(l);
      const res = F.bakeAdjust(l.canvas, l.adjust);
      if (!res.veraendert) { say('Diese Ebene hat keine Anpassungen'); break; }
      l.canvas = res.canvas;
      l.x -= res.offset * l.sx;
      l.y -= res.offset * l.sy;
      l.adjust = res.adjust;
      notify();
      say('Anpassungen sind jetzt Teil der Pixel');
      break;
    }

    /* --- Filter --- */
    case 'fx-sharpen': applyPixelOp(F.sharpen, 'Schärfen'); break;
    case 'fx-edge': applyPixelOp(F.edges, 'Kanten betonen'); break;
    case 'fx-emboss': applyPixelOp(F.emboss, 'Relief'); break;
    case 'fx-vignette': applyPixelOp(c => F.vignette(c, 0.75), 'Vignette'); break;
    case 'fx-autolevel': applyPixelOp(F.autoLevel, 'Auto-Tonwert'); break;
    case 'fx-flip-h': applyPixelOp(c => F.flip(c, true), 'Horizontal spiegeln'); break;
    case 'fx-flip-v': applyPixelOp(c => F.flip(c, false), 'Vertikal spiegeln'); break;
    case 'fx-rot90': applyPixelOp(F.rotate90, '90° drehen'); break;
    case 'fx-pixelate': {
      const r = await modal('Verpixeln', [{ key: 'v', label: 'Blockgröße (px)', type: 'number', value: 12, min: 2, max: 200 }]);
      if (r) applyPixelOp(c => F.pixelate(c, r.v), 'Verpixeln');
      break;
    }
    case 'fx-noise': {
      const r = await modal('Rauschen', [{ key: 'v', label: 'Stärke', type: 'number', value: 20, min: 1, max: 120 }]);
      if (r) applyPixelOp(c => F.noise(c, r.v), 'Rauschen');
      break;
    }
    case 'fx-posterize': {
      const r = await modal('Tontrennung', [{ key: 'v', label: 'Stufen', type: 'number', value: 5, min: 2, max: 32 }]);
      if (r) applyPixelOp(c => F.posterize(c, r.v), 'Tontrennung');
      break;
    }
    case 'fx-threshold': {
      const r = await modal('Schwellenwert', [{ key: 'v', label: 'Grenze (0–255)', type: 'number', value: 128, min: 0, max: 255 }]);
      if (r) applyPixelOp(c => F.threshold(c, r.v), 'Schwellenwert');
      break;
    }

    /* --- Seiten --- */
    case 'page-add': {
      const r = await modal('Leere Seite anhängen', [
        { key: 'w', label: 'Breite (px)', type: 'number', value: p.width, min: 1, max: 20000 },
        { key: 'h', label: 'Höhe (px)', type: 'number', value: p.height, min: 1, max: 20000 },
      ], { okLabel: 'Anhängen' });
      if (r) PDF.addBlankPage(r.w, r.h);
      break;
    }
    case 'page-dup': PDF.duplicatePage(); break;
    case 'page-del': PDF.deletePage(); break;
    case 'page-rot': PDF.rotatePage(); break;

    /* --- Ansicht --- */
    case 'zoom-in': setZoom(state.zoom * 1.25); break;
    case 'zoom-out': setZoom(state.zoom / 1.25); break;
    case 'zoom-fit': fitZoom(); break;

    /* --- Schrift --- */
    case 'load-font': {
      const f = await pickFile('.ttf,.otf,.woff,.woff2,font/*');
      if (!f) break;
      const name = await loadFontFile(f);
      refreshFontSelect();
      const cur = activeLayer();
      if (cur?.type === 'text') { commit('Schriftart'); cur.text.family = `"${name}"`; refreshLayer(cur); }
      notify();
      say(`Schrift „${name}“ geladen – sie wird im Projekt mitgespeichert`);
      break;
    }

    /* --- Hilfe --- */
    case 'shortcuts': await info('Tastenkürzel', SHORTCUT_HTML); break;
    case 'about': await info('Über Bildwerk', ABOUT_HTML); break;

    default: console.warn('Unbekannter Befehl:', cmd);
  }
}

Ihrem Rechner läuft. Es gibt keinen Server, keinen Upload und kein Konto –
geöffnete Dateien bleiben im Arbeitsspeicher des Browsers.</p>
<p>Umfang: Ebenen mit Mischmodi und Deckkraft, Pinsel und Radierer, Auswahl und
Zuschnitt, Formen, editierbare Textebenen mit eigenen Schriftdateien,
nicht-destruktive Anpassungen, einrechnende Filter sowie mehrseitige
PDF-Bearbeitung mit Export.</p>
<p>Der Programmcode belegt wenige hundert Kilobyte; die beiden PDF-Bibliotheken
kommen auf rund 3 MB.</p>`;

/* ================= main.js ================= */
/* Bildwerk – Start, Menüs, Tastatur, Drag & Drop. */





/* ---------------- Menüs ---------------- */

function initMenus() {
  const closeAll = () => document.querySelectorAll('.menu.open').forEach(m => m.classList.remove('open'));
  document.querySelectorAll('.menu-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const m = btn.parentElement;
      const open = m.classList.contains('open');
      closeAll();
      if (!open) m.classList.add('open');
    });
    btn.parentElement.addEventListener('mouseenter', () => {
      if (document.querySelector('.menu.open')) { closeAll(); btn.parentElement.classList.add('open'); }
    });
  });
  document.addEventListener('click', closeAll);

  /* Alle Schaltflächen mit data-cmd – Menü, Kopfleiste und Panels */
  document.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-cmd]');
    if (!btn) return;
    closeAll();
    try {
      await run(btn.dataset.cmd);
    } catch (err) {
      console.error(err);
      say('Fehler: ' + (err?.message || err));
    }
  });
}

/* ---------------- Tastatur ---------------- */

const TOOL_KEYS = { v: 'move', m: 'select', c: 'crop', b: 'brush', e: 'eraser', g: 'bucket',
  i: 'eyedrop', t: 'text', u: 'rect' };

function initKeys() {
  window.addEventListener('keydown', (ev) => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName);
    if (!$('#modal').hidden) return;
    const mod = ev.ctrlKey || ev.metaKey;

    if (mod) {
      const map = { z: 'undo', y: 'redo', j: 'copy-layer', d: 'select-none',
        n: 'new', o: 'open-image', s: 'save-project', e: 'export-png' };
      const cmd = ev.shiftKey && ev.key.toLowerCase() === 'z' ? 'redo' : map[ev.key.toLowerCase()];
      if (cmd) { ev.preventDefault(); run(cmd); }
      return;
    }
    if (typing) return;

    const k = ev.key.toLowerCase();
    if (TOOL_KEYS[k]) { setTool(TOOL_KEYS[k]); return; }

    switch (ev.key) {
      case 'Delete': case 'Backspace': ev.preventDefault(); run('clear-selection'); break;
      case 'Enter': if (getCropRect()) run('crop-to-selection'); break;
      case 'Escape': state.selection = null; clearCrop(); notify(); break;
      case '+': case '=': run('zoom-in'); break;
      case '-': run('zoom-out'); break;
      case '0': fitZoom(); break;
      case 'x': case 'X': run('swap-colors'); break;
      case '[': opts.size = Math.max(1, Math.round(opts.size * 0.8)); setTool(state.tool); say('Pinsel: ' + opts.size + ' px'); break;
      case ']': opts.size = Math.min(400, Math.round(opts.size * 1.25) + 1); setTool(state.tool); say('Pinsel: ' + opts.size + ' px'); break;
      case 'PageDown': if (state.active < state.pages.length - 1) { state.active++; notify(); } break;
      case 'PageUp': if (state.active > 0) { state.active--; notify(); } break;
      case 'ArrowLeft': case 'ArrowRight': case 'ArrowUp': case 'ArrowDown': {
        const l = activeLayer();
        if (!l) break;
        ev.preventDefault();
        const d = ev.shiftKey ? 10 : 1;
        commit('Verschieben');
        if (ev.key === 'ArrowLeft') l.x -= d;
        if (ev.key === 'ArrowRight') l.x += d;
        if (ev.key === 'ArrowUp') l.y -= d;
        if (ev.key === 'ArrowDown') l.y += d;
        notify();
        break;
      }
    }
  });
}

/* ---------------- Dateien hineinziehen ---------------- */

function initDrop() {
  const stop = (e) => { e.preventDefault(); e.stopPropagation(); };
  ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(t => document.addEventListener(t, stop));
  document.addEventListener('drop', async (ev) => {
    for (const f of [...(ev.dataTransfer?.files || [])]) {
      try { await handleDroppedFile(f); }
      catch (err) { console.error(err); say('Fehler: ' + err.message); }
    }
  });
}

/* ---------------- Start ---------------- */

function initLibState() {
  const node = $('#status-lib');
  node.textContent = 'PDF-Bibliotheken werden geladen …';
  (window.bildwerkLibs || Promise.resolve({})).then(libs => {
    const ok = Object.values(libs).filter(l => l.ok);
    if (ok.length === 2) {
      node.className = 'lib-state ok';
      node.textContent = ok.every(l => l.local) ? 'PDF: offline bereit' : 'PDF: bereit';
    } else {
      node.className = 'lib-state warn';
      node.textContent = 'PDF-Funktionen nicht verfügbar (siehe vendor/README.md)';
    }
  });
}

let booted = false;
function boot() {
  if (booted) return;
  booted = true;
  initUI();
  initMenus();
  initKeys();
  initDrop();
  initLibState();
  newDocument(1600, 1000, false);
  state.name = 'Unbenannt';
  say('Bereit – alles läuft lokal auf diesem Rechner');
  window.addEventListener('resize', () => scheduleRender());
  window.addEventListener('beforeunload', (e) => {
    if (state.dirty) { e.preventDefault(); e.returnValue = ''; }
  });
  /* Kleine Schnittstelle für die Browser-Konsole und automatische Tests */
  window.bildwerk = { state, page, run, importPdf, exportPdf, notify, fitZoom };
}

document.addEventListener('DOMContentLoaded', boot);
if (document.readyState !== 'loading') boot();

</script>
