<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bildwerk – Lokaler Bild- &amp; PDF-Editor</title>
<style>
/* Farben und Schrift nach EFCO Brand Book V1.3 (Dezember 2022), Seite 19.
   Hausfarben:  Schwefelgelb  #ede813  (Pantone 395C, RAL 1016)
                EFCO Anthrazit #3d4d54 (Pantone 439C)
                Anthrazitgrau  #373639 (Pantone 432C, RAL 7016)
                Sekundaertoene #54434a und #565442, Weiss #ffffff
   Hausschrift: Panton; fuer Office-Anwendungen Arial Regular/Bold.
   Panton ist lizenzpflichtig (myfonts) - ist sie auf dem Rechner
   installiert, wird sie benutzt, sonst greift Arial wie im Brand Book
   vorgesehen. */
:root{
  --efco-gelb:#ede813;
  --efco-anthrazit:#3d4d54;
  --efco-anthrazitgrau:#373639;
  --efco-sekundaer-1:#54434a;
  --efco-sekundaer-2:#565442;

  --bg:#2b2a2d;                    /* Arbeitsflaeche, aus Anthrazitgrau abgedunkelt */
  --bg2:var(--efco-anthrazit);     /* Leisten und Panels */
  --bg3:#48595f;                   /* Eingabefelder, aus Anthrazit aufgehellt */
  --line:#55686f;
  --fg:#ffffff;
  --fg-dim:#b7c3c8;
  --accent:var(--efco-gelb);
  --accent-dim:#b9b50f;
  --accent-fg:var(--efco-anthrazitgrau);   /* Text auf gelber Flaeche */
  --danger:#b5453f;
  --radius:7px;
  --topbar-h:42px; --status-h:24px;
  font-synthesis-weight:none;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--fg);
  font:13px/1.45 "Panton",Arial,Helvetica,sans-serif;
  display:flex; flex-direction:column; overflow:hidden; user-select:none;
}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit}

/* ---------- Topbar ---------- */
.topbar{
  height:var(--topbar-h); flex:0 0 auto; display:flex; align-items:center; gap:14px;
  padding:0 10px; background:var(--bg2); border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:7px;font-weight:600;letter-spacing:.2px}
.brand{text-transform:uppercase;letter-spacing:1.1px;font-weight:700}
.brand .mark{width:12px;height:12px;border-radius:50%;background:var(--efco-gelb)}
.menubar{display:flex;gap:2px}
.menu{position:relative}
.menu-btn{background:none;border:0;padding:6px 10px;border-radius:5px;cursor:pointer;color:var(--fg-dim)}
.menu-btn:hover,.menu.open .menu-btn{background:var(--bg3);color:var(--fg)}
.menu-pop{
  position:absolute; top:100%; left:0; min-width:260px; z-index:60;
  background:var(--bg3); border:1px solid var(--line); border-radius:var(--radius);
  padding:5px; display:none; box-shadow:0 12px 34px #0009;
}
.menu.open .menu-pop{display:block}
.menu-pop button{
  display:flex;justify-content:space-between;align-items:center;gap:20px;width:100%;
  background:none;border:0;text-align:left;padding:6px 9px;border-radius:5px;cursor:pointer;
}
.menu-pop button:hover{background:var(--accent);color:var(--accent-fg)}
.menu-pop kbd{font:11px/1 ui-monospace,monospace;color:var(--fg-dim);background:#0003;padding:3px 5px;border-radius:4px}
.menu-pop button:hover kbd{color:var(--accent-fg);background:#0002}
.menu-pop hr{border:0;border-top:1px solid var(--line);margin:5px 2px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:4px}
.icon-btn{background:var(--bg3);border:1px solid var(--line);border-radius:5px;width:28px;height:26px;cursor:pointer;line-height:1}
.icon-btn:hover{border-color:var(--accent)}
.zoom-label{min-width:52px;text-align:center;color:var(--fg-dim);font-variant-numeric:tabular-nums}
.sep{width:1px;height:18px;background:var(--line);margin:0 4px}

/* ---------- Layout ---------- */
.app{flex:1 1 auto;display:flex;min-height:0}
.tools{
  width:46px;flex:0 0 46px;background:var(--bg2);border-right:1px solid var(--line);
  padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;overflow-y:auto;
}
.tool{
  width:34px;height:34px;border-radius:6px;border:1px solid transparent;background:none;cursor:pointer;
  display:grid;place-items:center;font-size:15px;color:var(--fg-dim);
}
.tool:hover{background:var(--bg3);color:var(--fg)}
.tool.active{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tools .spacer{height:8px}

.workspace{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;min-height:0}
.options{
  flex:0 0 auto;min-height:36px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:4px 12px;background:var(--bg2);border-bottom:1px solid var(--line);
}
.options .opt{display:flex;align-items:center;gap:6px;color:var(--fg-dim)}
.options .opt input[type=range]{width:110px}
.options .opt input[type=number]{width:62px}
.options .opt output{min-width:32px;color:var(--fg);font-variant-numeric:tabular-nums}

.stage-wrap{
  position:relative;
  flex:1 1 auto;overflow:auto;display:grid;place-items:center;padding:26px;
  /* bewusst neutralgrau: ein farbiger Untergrund wuerde die Beurteilung
     der Bildfarben verfaelschen */
  background:
    linear-gradient(45deg,#1e1d20 25%,transparent 25%,transparent 75%,#1e1d20 75%),
    linear-gradient(45deg,#1e1d20 25%,#242326 25%,#242326 75%,#1e1d20 75%);
  background-size:22px 22px; background-position:0 0,11px 11px;
}
.stage{position:relative;box-shadow:0 0 0 1px #000,0 18px 50px #000a;line-height:0}
.pagethumb.active{box-shadow:0 0 0 2px var(--efco-gelb)}
.stage canvas{display:block;position:absolute;top:0;left:0;image-rendering:auto}
.stage #canvas{position:relative;
  background-image:
    linear-gradient(45deg,#c8c8c8 25%,transparent 25%,transparent 75%,#c8c8c8 75%),
    linear-gradient(45deg,#c8c8c8 25%,#efefef 25%,#efefef 75%,#c8c8c8 75%);
  background-size:16px 16px;background-position:0 0,8px 8px;
}
.stage #overlay{pointer-events:none}

.pagestrip{
  flex:0 0 auto;display:flex;gap:8px;padding:8px 10px;overflow-x:auto;
  background:var(--bg2);border-top:1px solid var(--line);
}
.pagethumb{
  position:relative;flex:0 0 auto;border:2px solid var(--line);border-radius:5px;cursor:pointer;
  background:#fff;padding:0;line-height:0;
}
.pagethumb.active{border-color:var(--accent)}
.pagethumb canvas{width:62px;height:auto;display:block;border-radius:3px}
.pagethumb span{
  position:absolute;bottom:2px;right:3px;font-size:10px;background:#000a;color:#fff;
  padding:0 4px;border-radius:3px;line-height:14px;
}

/* ---------- Panels ---------- */
.panels{
  width:282px;flex:0 0 282px;background:var(--bg2);border-left:1px solid var(--line);
  display:flex;flex-direction:column;overflow-y:auto;
}
.panel{padding:9px 11px;border-bottom:1px solid var(--line)}
.panel.grow{flex:1 1 auto;display:flex;flex-direction:column;min-height:170px}
.panel h3{
  margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--fg-dim);font-weight:600;
  display:flex;align-items:center;
}
.panel h3 .right{margin-left:auto;display:flex;gap:3px}
.mini{background:var(--bg3);border:1px solid var(--line);border-radius:4px;cursor:pointer;
  width:22px;height:20px;line-height:1;font-size:11px;padding:0}
.mini:hover{border-color:var(--accent)}
.mini.right{margin-left:auto}
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:7px;flex:1;min-width:0}
.field label{font-size:11px;color:var(--fg-dim);display:flex;justify-content:space-between}
.row{display:flex;gap:8px}
input[type=text],input[type=number],select,textarea{
  background:var(--bg3);border:1px solid var(--line);border-radius:5px;color:var(--fg);
  padding:5px 7px;width:100%;
}
input:focus,select:focus,textarea:focus{outline:1px solid var(--accent);border-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--efco-gelb)}
input[type=color]{background:var(--bg3);border:1px solid var(--line);border-radius:5px;height:28px;padding:2px;cursor:pointer}
textarea{resize:vertical;font-family:inherit}
.check{display:flex;align-items:center;gap:6px;color:var(--fg-dim);margin:2px 0 8px;cursor:pointer}
.btn{background:var(--bg3);border:1px solid var(--line);border-radius:5px;padding:6px 10px;cursor:pointer;flex:1}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.primary:hover{background:#f5f03a}
.btn.ghost{background:none}

.colors{display:flex;align-items:flex-end;gap:8px}
.swatch-label{flex:1;display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--fg-dim)}
.recent-colors{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.recent-colors button{width:17px;height:17px;border-radius:4px;border:1px solid #0006;cursor:pointer;padding:0}

.adjust-row{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.adjust-row label{width:74px;font-size:11px;color:var(--fg-dim);flex:0 0 auto}
.adjust-row input{flex:1}
.adjust-row output{width:38px;text-align:right;font-variant-numeric:tabular-nums;font-size:11px}

.layer-list{flex:1 1 auto;overflow-y:auto;margin-top:6px;display:flex;flex-direction:column;gap:3px}
.layer{
  display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:5px;cursor:pointer;
  border:1px solid transparent;background:var(--bg3);
}
.layer.active{border-color:var(--accent);background:#5c6f7780}
.layer .eye{background:none;border:0;cursor:pointer;font-size:12px;padding:0;width:16px;color:var(--fg-dim)}
.layer.hidden-layer{opacity:.45}
.layer .thumb{width:30px;height:30px;flex:0 0 auto;border-radius:3px;background:#fff;
  background-image:linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%),
    linear-gradient(45deg,#ccc 25%,#fff 25%,#fff 75%,#ccc 75%);
  background-size:10px 10px;background-position:0 0,5px 5px;object-fit:contain}
.layer .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer .name input{padding:2px 4px}
.layer .badge{font-size:9px;color:var(--fg-dim);border:1px solid var(--line);border-radius:3px;padding:0 3px}

.progress-box{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;
  background:var(--bg2);border:1px solid var(--line);border-radius:10px;
  padding:16px 18px;min-width:300px;box-shadow:0 18px 50px #000b;
}
.progress-title{font-weight:600;margin-bottom:10px}
.progress-bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.progress-bar span{display:block;height:100%;width:0;background:var(--efco-gelb);transition:width .15s linear}
.progress-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:14px}
.progress-foot span{color:var(--fg-dim);font-variant-numeric:tabular-nums}
.progress-foot .btn{flex:0 0 auto}

/* ---------- Status ---------- */
.statusbar{
  height:var(--status-h);flex:0 0 auto;display:flex;align-items:center;gap:16px;padding:0 12px;
  background:var(--bg2);border-top:1px solid var(--line);color:var(--fg-dim);font-size:11px;
}
.statusbar .grow{flex:1}
.lib-state.ok{color:var(--efco-gelb)}
.lib-state.warn{color:#e5a13a}

/* ---------- Modal ---------- */
.modal-backdrop{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:100}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:18px;
  min-width:340px;max-width:560px;max-height:82vh;overflow:auto;box-shadow:0 22px 70px #000b}
.modal h2{margin:0 0 12px;font-size:15px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.modal-actions .btn{flex:0 0 auto;min-width:92px}
.modal table{width:100%;border-collapse:collapse}
.modal td{padding:3px 6px;border-bottom:1px solid var(--line)}
.modal td:first-child{color:var(--fg-dim);white-space:nowrap}
.modal p{color:var(--fg-dim);line-height:1.6}

</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%233d4d54'/><circle cx='16' cy='16' r='7' fill='%23ede813'/></svg>">
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="mark"></span> Bildwerk</div>

  <nav class="menubar">
    <div class="menu">
      <button class="menu-btn" data-menu="file">Datei</button>
      <div class="menu-pop" data-pop="file">
        <button data-cmd="new">Neues Dokument…<kbd>Strg N</kbd></button>
        <button data-cmd="open-image">Bild öffnen…<kbd>Strg O</kbd></button>
        <button data-cmd="place-image">Bild als Ebene einfügen…</button>
        <button data-cmd="open-pdf">PDF öffnen…</button>
        <hr>
        <button data-cmd="save-project">Projekt speichern (.bildwerk)<kbd>Strg S</kbd></button>
        <button data-cmd="open-project">Projekt laden…</button>
        <hr>
        <button data-cmd="export-png">Export PNG<kbd>Strg E</kbd></button>
        <button data-cmd="export-jpg">Export JPEG…</button>
        <button data-cmd="export-webp">Export WebP</button>
        <button data-cmd="export-pdf">Export PDF…</button>
      </div>
    </div>

    <div class="menu">
      <button class="menu-btn" data-menu="edit">Bearbeiten</button>
      <div class="menu-pop" data-pop="edit">
        <button data-cmd="undo">Rückgängig<kbd>Strg Z</kbd></button>
        <button data-cmd="redo">Wiederholen<kbd>Strg Y</kbd></button>
        <hr>
        <button data-cmd="copy-layer">Ebene duplizieren<kbd>Strg J</kbd></button>
        <button data-cmd="delete-layer">Ebene löschen</button>
        <button data-cmd="clear-selection">Auswahl leeren<kbd>Entf</kbd></button>
        <button data-cmd="select-none">Auswahl aufheben<kbd>Strg D</kbd></button>
        <hr>
        <button data-cmd="crop-to-selection">Auf Auswahl zuschneiden</button>
        <button data-cmd="canvas-to-content">Leinwand auf Inhalt erweitern</button>
        <button data-cmd="resize-doc">Dokumentgröße…</button>
        <button data-cmd="resize-image">Bildgröße skalieren…</button>
        <button data-cmd="content-aware-scale">Inhaltsbasiert skalieren…</button>
      </div>
    </div>

    <div class="menu">
      <button class="menu-btn" data-menu="layer">Ebene</button>
      <div class="menu-pop" data-pop="layer">
        <button data-cmd="add-layer">Neue leere Ebene</button>
        <button data-cmd="add-text">Neue Textebene</button>
        <button data-cmd="merge-down">Mit darunter vereinen</button>
        <button data-cmd="flatten">Auf Hintergrund reduzieren</button>
        <hr>
        <button data-cmd="layer-up">Nach oben</button>
        <button data-cmd="layer-down">Nach unten</button>
        <hr>
        <button data-cmd="fit-layer">Ebene einpassen</button>
        <button data-cmd="reset-transform">Transformation zurücksetzen</button>
      </div>
    </div>

    <div class="menu">
      <button class="menu-btn" data-menu="filter">Filter</button>
      <div class="menu-pop" data-pop="filter">
        <button data-cmd="bake-adjust">Anpassungen einrechnen</button>
        <hr>
        <button data-cmd="fx-sharpen">Schärfen</button>
        <button data-cmd="fx-edge">Kanten betonen</button>
        <button data-cmd="fx-emboss">Relief</button>
        <button data-cmd="fx-pixelate">Verpixeln…</button>
        <button data-cmd="fx-noise">Rauschen…</button>
        <button data-cmd="fx-posterize">Tontrennung…</button>
        <button data-cmd="fx-threshold">Schwellenwert…</button>
        <button data-cmd="fx-vignette">Vignette</button>
        <hr>
        <button data-cmd="fx-autolevel">Auto-Tonwert</button>
        <button data-cmd="fx-flip-h">Horizontal spiegeln</button>
        <button data-cmd="fx-flip-v">Vertikal spiegeln</button>
        <button data-cmd="fx-rot90">90° drehen</button>
      </div>
    </div>

    <div class="menu">
      <button class="menu-btn" data-menu="pdf">PDF</button>
      <div class="menu-pop" data-pop="pdf">
        <button data-cmd="open-pdf">PDF öffnen…</button>
        <button data-cmd="pdf-append">PDF anhängen (zusammenführen)…</button>
        <hr>
        <button data-cmd="page-add">Leere Seite anhängen</button>
        <button data-cmd="page-dup">Seite duplizieren</button>
        <button data-cmd="page-del">Seite löschen</button>
        <button data-cmd="page-rot">Seite 90° drehen</button>
        <hr>
        <button data-cmd="export-pdf">Als PDF exportieren…</button>
      </div>
    </div>

    <div class="menu">
      <button class="menu-btn" data-menu="help">Hilfe</button>
      <div class="menu-pop" data-pop="help">
        <button data-cmd="shortcuts">Tastenkürzel</button>
        <button data-cmd="about">Über Bildwerk</button>
      </div>
    </div>
  </nav>

  <div class="topbar-right">
    <button class="icon-btn" data-cmd="undo" title="Rückgängig (Strg+Z)">↶</button>
    <button class="icon-btn" data-cmd="redo" title="Wiederholen (Strg+Y)">↷</button>
    <span class="sep"></span>
    <button class="icon-btn" data-cmd="zoom-out" title="Verkleinern">−</button>
    <span id="zoom-label" class="zoom-label">100%</span>
    <button class="icon-btn" data-cmd="zoom-in" title="Vergrößern">+</button>
    <button class="icon-btn" data-cmd="zoom-fit" title="Einpassen">⤢</button>
  </div>
</header>

<main class="app">
  <aside class="tools" id="toolbar"></aside>

  <section class="workspace">
    <div class="options" id="tool-options"></div>
    <div class="stage-wrap" id="stage-wrap">
      <div class="stage" id="stage">
        <canvas id="canvas"></canvas>
        <canvas id="overlay"></canvas>
      </div>
      <div class="progress-box" id="progress" hidden>
        <div class="progress-title" id="progress-title">Arbeitet…</div>
        <div class="progress-bar"><span id="progress-fill"></span></div>
        <div class="progress-foot">
          <span id="progress-pct">0 %</span>
          <button class="btn" id="progress-cancel">Abbrechen</button>
        </div>
      </div>
    </div>
    <div class="pagestrip" id="pagestrip" hidden></div>
  </section>

  <aside class="panels">
    <div class="panel">
      <h3>Farben</h3>
      <div class="colors">
        <label class="swatch-label">
          <span>Vordergrund</span>
          <input type="color" id="fg-color" value="#373639">
        </label>
        <label class="swatch-label">
          <span>Hintergrund</span>
          <input type="color" id="bg-color" value="#ffffff">
        </label>
        <button class="mini" data-cmd="swap-colors" title="Tauschen (X)">⇄</button>
      </div>
      <div class="recent-colors" id="recent-colors"></div>
    </div>

    <div class="panel" id="panel-text" hidden>
      <h3>Schrift</h3>
      <div class="field"><label>Text</label><textarea id="t-content" rows="3"></textarea></div>
      <div class="field"><label>Schriftart</label><select id="t-family"></select></div>
      <div class="row">
        <div class="field"><label>Größe</label><input type="number" id="t-size" min="4" max="800" value="64"></div>
        <div class="field"><label>Schnitt</label>
          <select id="t-weight">
            <option value="300">Leicht</option>
            <option value="400" selected>Normal</option>
            <option value="600">Halbfett</option>
            <option value="700">Fett</option>
            <option value="900">Schwarz</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="field"><label>Zeilenhöhe</label><input type="number" id="t-line" step="0.05" min="0.5" max="4" value="1.2"></div>
        <div class="field"><label>Laufweite</label><input type="number" id="t-spacing" step="0.5" min="-20" max="80" value="0"></div>
      </div>
      <div class="row">
        <div class="field"><label>Ausrichtung</label>
          <select id="t-align"><option value="left">links</option><option value="center">zentriert</option><option value="right">rechts</option></select>
        </div>
        <div class="field"><label>Farbe</label><input type="color" id="t-color" value="#373639"></div>
      </div>
      <div class="row">
        <div class="field"><label>Kontur</label><input type="color" id="t-stroke" value="#ffffff"></div>
        <div class="field"><label>Konturstärke</label><input type="number" id="t-strokew" min="0" max="40" step="0.5" value="0"></div>
      </div>
      <label class="check"><input type="checkbox" id="t-italic"> Kursiv</label>
      <div class="row">
        <button class="btn" data-cmd="load-font">Schriftdatei laden…</button>
        <button class="btn" data-cmd="rasterize-text">Rastern</button>
      </div>
    </div>

    <div class="panel">
      <h3>Anpassungen <button class="mini right" data-cmd="reset-adjust" title="Zurücksetzen">⟲</button></h3>
      <div id="adjust-list"></div>
    </div>

    <div class="panel grow">
      <h3>Ebenen
        <span class="right">
          <button class="mini" data-cmd="add-layer" title="Neue Ebene">+</button>
          <button class="mini" data-cmd="copy-layer" title="Duplizieren">⧉</button>
          <button class="mini" data-cmd="delete-layer" title="Löschen">🗑</button>
        </span>
      </h3>
      <div class="row layer-props">
        <div class="field"><label>Deckkraft <span id="op-val">100%</span></label>
          <input type="range" id="l-opacity" min="0" max="100" value="100"></div>
      </div>

<script>
/* Bildwerk – lädt die beiden PDF-Bibliotheken.
   Bevorzugt lokale Kopien in vendor/ (vollständig offline),
   fällt sonst einmalig auf ein CDN zurück. Ohne beides bleiben
   nur die PDF-Funktionen deaktiviert; der Bildeditor läuft weiter. */
(function () {
  const LIBS = [
    {
      key: 'pdflib', label: 'pdf-lib',
      local: 'vendor/pdf-lib.min.js',
      cdn: 'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js',
      ok: () => !!window.PDFLib,
    },
    {
      key: 'pdfjs', label: 'pdf.js',
      local: 'vendor/pdf.min.js',
      cdn: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js',
      ok: () => !!window.pdfjsLib,
      after(fromLocal) {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = fromLocal
          ? 'vendor/pdf.worker.min.js'
          : 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
      },
    },
  ];

  function load(url) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = url;
      s.onload = resolve;
      s.onerror = () => reject(new Error('nicht ladbar: ' + url));
      document.head.appendChild(s);
    });
  }

  async function one(lib) {
    for (const [src, isLocal] of [[lib.local, true], [lib.cdn, false]]) {
      try {
        await load(src);
        if (!lib.ok()) continue;
        lib.after?.(isLocal);
        return { key: lib.key, label: lib.label, ok: true, local: isLocal };
      } catch (_) { /* nächste Quelle */ }
    }
    return { key: lib.key, label: lib.label, ok: false };
  }

  window.bildwerkLibs = Promise.all(LIBS.map(one)).then(res => {
    const map = {};
    for (const r of res) map[r.key] = r;
    window.bildwerkLibState = map;
    return map;
  });
})();

</script>
<script type="module">

/* ================= core.js ================= */
/* Bildwerk – Kern: Dokumentmodell, Ebenen, Rendering, Historie.
   Alles läuft lokal im Browser; es verlässt kein Byte den Rechner. */

const BLEND_MODES = [
  ['source-over', 'Normal'], ['multiply', 'Multiplizieren'], ['screen', 'Negativ multiplizieren'],
  ['overlay', 'Ineinanderkopieren'], ['darken', 'Abdunkeln'], ['lighten', 'Aufhellen'],
  ['color-dodge', 'Farbig abwedeln'], ['color-burn', 'Farbig nachbelichten'],
  ['hard-light', 'Hartes Licht'], ['soft-light', 'Weiches Licht'], ['difference', 'Differenz'],
  ['exclusion', 'Ausschluss'], ['hue', 'Farbton'], ['saturation', 'Sättigung'],
  ['color', 'Farbe'], ['luminosity', 'Luminanz'],
];

const ADJUSTMENTS = [
  { key: 'brightness', label: 'Helligkeit', min: 0, max: 300, def: 100, unit: '%' },
  { key: 'contrast',   label: 'Kontrast',   min: 0, max: 300, def: 100, unit: '%' },
  { key: 'saturate',   label: 'Sättigung',  min: 0, max: 400, def: 100, unit: '%' },
  { key: 'hue',        label: 'Farbton',    min: -180, max: 180, def: 0, unit: '°' },
  { key: 'blur',       label: 'Weichzeichnen', min: 0, max: 60, def: 0, unit: 'px' },
  { key: 'sepia',      label: 'Sepia',      min: 0, max: 100, def: 0, unit: '%' },
  { key: 'grayscale',  label: 'Graustufen', min: 0, max: 100, def: 0, unit: '%' },
  { key: 'invert',     label: 'Invertieren',min: 0, max: 100, def: 0, unit: '%' },
];

/* Browser-Grenzen fuer Canvas. Darueber liefert Chrome leere Flaechen,
   statt einen Fehler zu melden - deshalb halten wir bewusst Abstand. */
const MAX_EDGE = 16384;
const MAX_AREA = 200e6;

/** Groesste erlaubte Vergroesserung, bei der die Buehne noch gezeichnet wird. */
function maxZoomFor(p, hardLimit = 16) {
  if (!p) return hardLimit;
  return Math.max(0.02, Math.min(
    hardLimit,
    MAX_EDGE / p.width,
    MAX_EDGE / p.height,
    Math.sqrt(MAX_AREA / (p.width * p.height)),
  ));
}

/** Passt eine gewuenschte Canvasgroesse in die Browsergrenzen ein. */
function fitCanvasSize(w, h) {
  let s = Math.min(1, MAX_EDGE / w, MAX_EDGE / h, Math.sqrt(MAX_AREA / (w * h)));
  if (!isFinite(s) || s <= 0) s = 1;
  return { w: Math.max(1, Math.floor(w * s)), h: Math.max(1, Math.floor(h * s)), scale: s };
}

let uid = 1;
const newId = () => 'id' + (uid++);

const state = {
  name: 'Unbenannt',
  pages: [],
  active: 0,
  zoom: 1,
  tool: 'move',
  fg: '#373639',   // EFCO Anthrazitgrau
  bg: '#ffffff',
  selection: null,       // {x,y,w,h} in Dokumentkoordinaten
  recentColors: ['#ede813', '#3d4d54', '#373639', '#54434a', '#565442', '#ffffff'],
  sourcePdfBytes: null,  // Original-PDF für den verlustarmen Export
  dirty: false,
};

/* ---------------- Hilfsfunktionen ---------------- */

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w));
  c.height = Math.max(1, Math.round(h));
  return c;
}

function cloneCanvas(src) {
  const c = makeCanvas(src.width, src.height);
  c.getContext('2d').drawImage(src, 0, 0);
  return c;
}

function defaultAdjust() {
  const a = {};
  for (const d of ADJUSTMENTS) a[d.key] = d.def;
  return a;
}

function isAdjustNeutral(a) {
  return ADJUSTMENTS.every(d => Math.abs((a[d.key] ?? d.def) - d.def) < 0.001);
}

function filterString(a) {
  if (!a || isAdjustNeutral(a)) return 'none';
  return [
    `brightness(${a.brightness}%)`,
    `contrast(${a.contrast}%)`,
    `saturate(${a.saturate}%)`,
    `hue-rotate(${a.hue}deg)`,
    a.blur > 0 ? `blur(${a.blur}px)` : '',
    a.sepia > 0 ? `sepia(${a.sepia}%)` : '',
    a.grayscale > 0 ? `grayscale(${a.grayscale}%)` : '',
    a.invert > 0 ? `invert(${a.invert}%)` : '',
  ].filter(Boolean).join(' ');
}

/* ---------------- Seiten & Ebenen ---------------- */

function createPage(w = 1200, h = 800, bgColor = '#ffffff') {
  return {
    id: newId(),
    width: Math.round(w),
    height: Math.round(h),
    bgColor,
    layers: [],
    pdfSource: null, // {index} – Verweis auf Seite im Original-PDF
  };
}

function createLayer(opts = {}) {
  return {
    id: newId(),
    name: opts.name || 'Ebene',
    type: opts.type || 'raster',   // raster | text | shape
    visible: true,
    opacity: 1,
    blend: 'source-over',
    x: opts.x ?? 0,
    y: opts.y ?? 0,
    rot: 0,
    sx: 1,
    sy: 1,
    canvas: opts.canvas || makeCanvas(opts.w || 1, opts.h || 1),
    adjust: defaultAdjust(),
    text: opts.text || null,
    shape: opts.shape || null,
  };
}

const page = () => state.pages[state.active];
const layers = () => page()?.layers ?? [];

function activeLayer() {
  const p = page();
  if (!p) return null;
  return p.layers.find(l => l.id === p.activeLayerId) || p.layers[p.layers.length - 1] || null;
}

function setActiveLayer(id) {
  const p = page();
  if (p) p.activeLayerId = id;
}

function addLayer(layer, { atTop = true } = {}) {
  const p = page();
  if (atTop) p.layers.push(layer); else p.layers.unshift(layer);
  p.activeLayerId = layer.id;
  return layer;
}

function removeLayer(id) {
  const p = page();
  const i = p.layers.findIndex(l => l.id === id);
  if (i < 0) return;
  p.layers.splice(i, 1);
  const next = p.layers[Math.min(i, p.layers.length - 1)];
  p.activeLayerId = next ? next.id : null;
}

/* Kopie-bei-Schreibzugriff: vor jeder Pixeländerung aufrufen, damit
   ältere Historieneinträge ihr Canvas behalten. */
function beginPixelEdit(layer) {
  layer.canvas = cloneCanvas(layer.canvas);
  return layer.canvas.getContext('2d');
}

/* ---------------- Transformationen ---------------- */

function layerMatrix(layer) {
  const w = layer.canvas.width, h = layer.canvas.height;
  const cx = layer.x + (w * layer.sx) / 2;
  const cy = layer.y + (h * layer.sy) / 2;
  return new DOMMatrix()
    .translate(cx, cy)
    .rotate((layer.rot * 180) / Math.PI)
    .scale(layer.sx, layer.sy)
    .translate(-w / 2, -h / 2);
}

/** Dokumentpunkt -> Pixelkoordinate innerhalb des Ebenen-Canvas */
function docToLayer(layer, px, py) {
  const inv = layerMatrix(layer).inverse();
  const p = inv.transformPoint(new DOMPoint(px, py));
  return { x: p.x, y: p.y };
}

function layerToDoc(layer, lx, ly) {
  const p = layerMatrix(layer).transformPoint(new DOMPoint(lx, ly));
  return { x: p.x, y: p.y };
}

function layerCorners(layer) {
  const w = layer.canvas.width, h = layer.canvas.height;
  return [[0, 0], [w, 0], [w, h], [0, h]].map(([x, y]) => layerToDoc(layer, x, y));
}

function layerBBox(layer) {
  const c = layerCorners(layer);
  const xs = c.map(p => p.x), ys = c.map(p => p.y);
  const x = Math.min(...xs), y = Math.min(...ys);
  return { x, y, w: Math.max(...xs) - x, h: Math.max(...ys) - y };
}

function hitLayer(layer, px, py) {
  const p = docToLayer(layer, px, py);
  return p.x >= 0 && p.y >= 0 && p.x < layer.canvas.width && p.y < layer.canvas.height;
}

/** Umschliessender Rahmen mehrerer Ebenen, optional samt Leinwand. */
function unionBounds(list, withPage = null) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const l of list) {
    const b = layerBBox(l);
    x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y);
    x1 = Math.max(x1, b.x + b.w); y1 = Math.max(y1, b.y + b.h);
  }
  if (withPage) {
    x0 = Math.min(x0, 0); y0 = Math.min(y0, 0);
    x1 = Math.max(x1, withPage.width); y1 = Math.max(y1, withPage.height);
  }
  if (!isFinite(x0)) return { x: 0, y: 0, w: 1, h: 1 };
  return { x: Math.floor(x0), y: Math.floor(y0), w: Math.ceil(x1 - x0), h: Math.ceil(y1 - y0) };
}

/* ---------------- Text & Formen rastern ---------------- */

function defaultText(content = 'Text') {
  return {
    content,
    family: '"Panton", Arial, Helvetica, sans-serif',
    size: 64,
    weight: '400',
    italic: false,
    color: '#373639',
    stroke: '#ffffff',
    strokeWidth: 0,
    align: 'left',
    lineHeight: 1.2,
    spacing: 0,
  };
}

function fontOf(t) {
  return `${t.italic ? 'italic ' : ''}${t.weight} ${t.size}px ${t.family}`;
}

function rasterizeText(layer) {
  const t = layer.text;
  const lines = String(t.content ?? '').split('\n');
  const probe = makeCanvas(8, 8).getContext('2d');
  probe.font = fontOf(t);
  const hasSpacingApi = 'letterSpacing' in probe;
  if (hasSpacingApi) probe.letterSpacing = `${t.spacing}px`;

  const widths = lines.map(line => {
    if (hasSpacingApi) return probe.measureText(line).width;
    let w = 0;
    for (const ch of line) w += probe.measureText(ch).width + t.spacing;
    return Math.max(0, w - (line.length ? t.spacing : 0));
  });

  const lineH = t.size * t.lineHeight;
  const pad = Math.ceil(t.size * 0.35 + t.strokeWidth * 2 + 4);
  const w = Math.ceil(Math.max(1, ...widths)) + pad * 2;
  const h = Math.ceil(lineH * lines.length) + pad * 2;

  const c = makeCanvas(w, h);
  const ctx = c.getContext('2d');
  ctx.font = fontOf(t);
  if (hasSpacingApi) ctx.letterSpacing = `${t.spacing}px`;
  ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round';
  ctx.miterLimit = 2;

  lines.forEach((line, i) => {
    const baseY = pad + lineH * i + t.size * 0.82;
    let x = pad;
    if (t.align === 'center') x = pad + (w - pad * 2 - widths[i]) / 2;
    if (t.align === 'right') x = pad + (w - pad * 2 - widths[i]);

    const draw = (fn) => {
      if (hasSpacingApi) { fn(line, x, baseY); return; }
      let cx = x;
      for (const ch of line) { fn(ch, cx, baseY); cx += ctx.measureText(ch).width + t.spacing; }
    };
    if (t.strokeWidth > 0) {
      ctx.strokeStyle = t.stroke;
      ctx.lineWidth = t.strokeWidth * 2;
      draw((s, px, py) => ctx.strokeText(s, px, py));
    }
    ctx.fillStyle = t.color;
    draw((s, px, py) => ctx.fillText(s, px, py));
  });

  layer.canvas = c;
  return c;
}

function rasterizeShape(layer) {
  const s = layer.shape;
  const pad = Math.ceil(s.strokeWidth) + 2;
  const aw = Math.max(1, Math.abs(s.w)), ah = Math.max(1, Math.abs(s.h));
  const c = makeCanvas(aw + pad * 2, ah + pad * 2);
  const ctx = c.getContext('2d');
  ctx.translate(pad, pad);
  ctx.beginPath();
  if (s.kind === 'ellipse') {
    ctx.ellipse(aw / 2, ah / 2, aw / 2, ah / 2, 0, 0, Math.PI * 2);
  } else if (s.kind === 'line') {
    const x0 = s.w < 0 ? aw : 0, y0 = s.h < 0 ? ah : 0;
    ctx.moveTo(x0, y0);
    ctx.lineTo(aw - x0, ah - y0);
  } else {
    const r = Math.min(s.radius || 0, aw / 2, ah / 2);
    if (r > 0 && ctx.roundRect) ctx.roundRect(0, 0, aw, ah, r);
    else ctx.rect(0, 0, aw, ah);
  }
  if (s.kind !== 'line' && s.fill !== 'none') { ctx.fillStyle = s.fill; ctx.fill(); }
  if (s.strokeWidth > 0) {
    ctx.strokeStyle = s.stroke; ctx.lineWidth = s.strokeWidth;
    ctx.lineCap = 'round'; ctx.stroke();
  }
  layer.canvas = c;
  return c;
}

function refreshLayer(layer) {
  if (layer.type === 'text') rasterizeText(layer);
  else if (layer.type === 'shape') rasterizeShape(layer);
}

/* ---------------- Rendering ---------------- */

function drawLayer(ctx, layer) {
  if (!layer.visible || layer.opacity <= 0) return;
  ctx.save();
  ctx.globalAlpha = layer.opacity;
  ctx.globalCompositeOperation = layer.blend;
  ctx.filter = filterString(layer.adjust);
  const m = layerMatrix(layer);
  ctx.setTransform(new DOMMatrix(ctx.getTransform()).multiply(m));
  ctx.drawImage(layer.canvas, 0, 0);
  ctx.restore();
}

/** Seite auf einen Kontext zeichnen. scale=1 entspricht 1:1. */
function renderPage(p, ctx, { scale = 1, transparent = false } = {}) {
  ctx.save();
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.clearRect(0, 0, p.width, p.height);
  if (!transparent && p.bgColor) {
    ctx.fillStyle = p.bgColor;
    ctx.fillRect(0, 0, p.width, p.height);
  }
  for (const l of p.layers) drawLayer(ctx, l);
  ctx.restore();
}

/** Seite als eigenständiges Canvas (für Export, Miniaturen, PDF). */
function pageToCanvas(p, scale = 1, transparent = false) {
  const c = makeCanvas(p.width * scale, p.height * scale);
  renderPage(p, c.getContext('2d'), { scale, transparent });
  return c;
}

/** Ebene mit allen Anpassungen flach in Dokumentkoordinaten rendern. */
function flattenLayer(p, layer) {
  const c = makeCanvas(p.width, p.height);
  drawLayer(c.getContext('2d'), layer);
  return c;
}

/* ---------------- Historie ---------------- */

const history = { past: [], future: [], limit: 40 };

function snapPages() {
  return state.pages.map(p => ({
    ...p,
    layers: p.layers.map(l => ({
      ...l,
      adjust: { ...l.adjust },
      text: l.text ? { ...l.text } : null,
      shape: l.shape ? { ...l.shape } : null,
    })),
  }));
}

function snapshot() {
  return { pages: snapPages(), active: state.active, selection: state.selection ? { ...state.selection } : null };
}

function apply(sn) {
  state.pages = sn.pages.map(p => ({
    ...p,
    layers: p.layers.map(l => ({
      ...l,
      adjust: { ...l.adjust },
      text: l.text ? { ...l.text } : null,
      shape: l.shape ? { ...l.shape } : null,
    })),
  }));
  state.active = Math.min(sn.active, state.pages.length - 1);
  state.selection = sn.selection ? { ...sn.selection } : null;
}

/** Vor jeder Änderung aufrufen – sichert den aktuellen Stand. */
function commit(label = '') {
  history.past.push({ ...snapshot(), label });
  if (history.past.length > history.limit) history.past.shift();
  history.future.length = 0;
  state.dirty = true;
}

function undo() {
  if (!history.past.length) return false;
  history.future.push(snapshot());
  apply(history.past.pop());
  return true;
}

function redo() {
  if (!history.future.length) return false;
  history.past.push(snapshot());
  apply(history.future.pop());
  return true;
}

const canUndo = () => history.past.length > 0;
const canRedo = () => history.future.length > 0;
function resetHistory() { history.past.length = 0; history.future.length = 0; }

/* ---------------- Ereignisse ---------------- */

const listeners = { change: [], status: [] };
function on(evt, fn) { (listeners[evt] ||= []).push(fn); }
function emit(evt, arg) { (listeners[evt] || []).forEach(fn => fn(arg)); }
const notify = () => emit('change');
const say = (msg) => emit('status', msg);

/* ================= filters.js ================= */
/* Bildwerk – Pixeloperationen (einrechnende Filter). */

const px = (c) => c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, c.width, c.height);
const put = (c, d) => { c.getContext('2d').putImageData(d, 0, 0); return c; };
const clamp = (v) => v < 0 ? 0 : v > 255 ? 255 : v;

/** Nicht-destruktive Anpassungen dauerhaft ins Pixelbild schreiben.
 *  Liefert immer dieselbe Form, damit die Aufrufer nicht zwei Faelle
 *  unterscheiden muessen: { canvas, offset, adjust, veraendert }. */
function bakeAdjust(canvas, adjust) {
  const f = filterString(adjust);
  if (f === 'none')
    return { canvas, offset: 0, adjust: defaultAdjust(), veraendert: false };
  const pad = Math.ceil((adjust.blur || 0) * 3);
  const out = makeCanvas(canvas.width + pad * 2, canvas.height + pad * 2);
  const ctx = out.getContext('2d');
  ctx.filter = f;
  ctx.drawImage(canvas, pad, pad);
  return { canvas: out, offset: pad, adjust: defaultAdjust(), veraendert: true };
}

function convolve(canvas, kernel, divisor = 1, offset = 0) {
  const k = Math.round(Math.sqrt(kernel.length));
  const half = (k - 1) / 2;
  const src = px(canvas), w = canvas.width, h = canvas.height;
  const out = new ImageData(w, h);
  const s = src.data, d = out.data;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let r = 0, g = 0, b = 0;
      for (let ky = 0; ky < k; ky++) {
        for (let kx = 0; kx < k; kx++) {
          const sy = Math.min(h - 1, Math.max(0, y + ky - half));
          const sx = Math.min(w - 1, Math.max(0, x + kx - half));
          const i = (sy * w + sx) * 4, kv = kernel[ky * k + kx];
          r += s[i] * kv; g += s[i + 1] * kv; b += s[i + 2] * kv;
        }
      }
      const o = (y * w + x) * 4;
      d[o] = clamp(r / divisor + offset);
      d[o + 1] = clamp(g / divisor + offset);
      d[o + 2] = clamp(b / divisor + offset);
      d[o + 3] = s[o + 3];
    }
  }
  return put(makeCanvas(w, h), out);
}

const sharpen = (c) => convolve(c, [0, -1, 0, -1, 5, -1, 0, -1, 0]);
const edges   = (c) => convolve(c, [-1, -1, -1, -1, 8, -1, -1, -1, -1], 1, 0);
const emboss  = (c) => convolve(c, [-2, -1, 0, -1, 1, 1, 0, 1, 2], 1, 0);
const softBlur= (c) => convolve(c, [1, 2, 1, 2, 4, 2, 1, 2, 1], 16);

function pixelate(canvas, size = 12) {
  const w = canvas.width, h = canvas.height;
  const small = makeCanvas(Math.max(1, w / size), Math.max(1, h / size));
  const sc = small.getContext('2d');
  sc.imageSmoothingEnabled = true;
  sc.drawImage(canvas, 0, 0, small.width, small.height);
  const out = makeCanvas(w, h);
  const oc = out.getContext('2d');
  oc.imageSmoothingEnabled = false;
  oc.drawImage(small, 0, 0, w, h);
  return out;
}

function noise(canvas, amount = 20) {
  const d = px(canvas), a = d.data;
  for (let i = 0; i < a.length; i += 4) {
    const n = (Math.random() - 0.5) * amount * 2;
    a[i] = clamp(a[i] + n); a[i + 1] = clamp(a[i + 1] + n); a[i + 2] = clamp(a[i + 2] + n);
  }
  return put(makeCanvas(canvas.width, canvas.height), d);
}

function posterize(canvas, levels = 5) {
  const d = px(canvas), a = d.data;
  const step = 255 / Math.max(1, levels - 1);
  for (let i = 0; i < a.length; i += 4)
    for (let k = 0; k < 3; k++) a[i + k] = clamp(Math.round(a[i + k] / step) * step);
  return put(makeCanvas(canvas.width, canvas.height), d);
}

function threshold(canvas, level = 128) {
  const d = px(canvas), a = d.data;
  for (let i = 0; i < a.length; i += 4) {
    const v = a[i] * 0.299 + a[i + 1] * 0.587 + a[i + 2] * 0.114 >= level ? 255 : 0;
    a[i] = a[i + 1] = a[i + 2] = v;
  }
  return put(makeCanvas(canvas.width, canvas.height), d);
}

function autoLevel(canvas) {
  const d = px(canvas), a = d.data;
  let lo = 255, hi = 0;
  for (let i = 0; i < a.length; i += 4) {
    if (a[i + 3] < 8) continue;
    const l = a[i] * 0.299 + a[i + 1] * 0.587 + a[i + 2] * 0.114;
    if (l < lo) lo = l; if (l > hi) hi = l;
  }
  if (hi - lo < 1) return canvas;
  const scale = 255 / (hi - lo);
  for (let i = 0; i < a.length; i += 4)
    for (let k = 0; k < 3; k++) a[i + k] = clamp((a[i + k] - lo) * scale);
  return put(makeCanvas(canvas.width, canvas.height), d);
}

function vignette(canvas, strength = 0.75) {
  const out = makeCanvas(canvas.width, canvas.height);
  const ctx = out.getContext('2d');
  ctx.drawImage(canvas, 0, 0);
  const w = canvas.width, h = canvas.height;
  const g = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.32, w / 2, h / 2, Math.max(w, h) * 0.72);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, `rgba(0,0,0,${strength})`);
  ctx.globalCompositeOperation = 'source-atop';
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  return out;
}

function flip(canvas, horizontal = true) {
  const out = makeCanvas(canvas.width, canvas.height);
  const ctx = out.getContext('2d');
  ctx.translate(horizontal ? canvas.width : 0, horizontal ? 0 : canvas.height);
  ctx.scale(horizontal ? -1 : 1, horizontal ? 1 : -1);
  ctx.drawImage(canvas, 0, 0);
  return out;
}

function rotate90(canvas) {
  const out = makeCanvas(canvas.height, canvas.width);
  const ctx = out.getContext('2d');
  ctx.translate(out.width / 2, out.height / 2);
  ctx.rotate(Math.PI / 2);
  ctx.drawImage(canvas, -canvas.width / 2, -canvas.height / 2);
  return out;
}

/** Farbeimer mit Toleranz; arbeitet direkt auf dem übergebenen Canvas. */
function floodFill(canvas, sx, sy, hex, tolerance = 32) {
  const w = canvas.width, h = canvas.height;
  sx = Math.floor(sx); sy = Math.floor(sy);
  if (sx < 0 || sy < 0 || sx >= w || sy >= h) return false;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const img = ctx.getImageData(0, 0, w, h);
  const a = img.data;
  const start = (sy * w + sx) * 4;
  const target = [a[start], a[start + 1], a[start + 2], a[start + 3]];
  const fill = hexToRgb(hex);
  if (target[0] === fill[0] && target[1] === fill[1] && target[2] === fill[2] && target[3] === 255) return false;

  const tol = tolerance * tolerance * 4;
  const seen = new Uint8Array(w * h);
  const stack = [sy * w + sx];
  const match = (i) => {
    const o = i * 4;
    const dr = a[o] - target[0], dg = a[o + 1] - target[1], db = a[o + 2] - target[2], da = a[o + 3] - target[3];
    return dr * dr + dg * dg + db * db + da * da <= tol;
  };
  while (stack.length) {
    const i = stack.pop();
    if (seen[i] || !match(i)) continue;
    seen[i] = 1;
    const o = i * 4;
    a[o] = fill[0]; a[o + 1] = fill[1]; a[o + 2] = fill[2]; a[o + 3] = 255;
    const x = i % w, y = (i / w) | 0;
    if (x > 0) stack.push(i - 1);
    if (x < w - 1) stack.push(i + 1);
    if (y > 0) stack.push(i - w);
    if (y < h - 1) stack.push(i + w);
  }
  ctx.putImageData(img, 0, 0);
  return true;
}

function hexToRgb(hex) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex.trim());
  return m ? [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)] : [0, 0, 0];
}

function rgbToHex(r, g, b) {
  return '#' + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
}

/* ================= seamcarve.js ================= */
/* Bildwerk – Inhaltsbasiertes Skalieren (Seam Carving).
 *
 * Statt das Bild gleichmaessig zu stauchen, werden die unauffaelligsten
 * Pixelpfade ("Nahtlinien") entfernt bzw. verdoppelt. Motive bleiben dadurch
 * in Form, waehrend ruhige Flaechen wie Himmel oder Wand nachgeben.
 *
 * Zur Geschwindigkeit: Alle Daten liegen in festen Puffern mit konstanter
 * Zeilenlaenge (stride). Eine Naht wird nicht in neue Arrays umkopiert,
 * sondern mit copyWithin innerhalb des Puffers geschlossen - das erledigt
 * die JavaScript-Laufzeit nativ. Nur die logische Breite schrumpft.
 * Ausserdem wird die Energiekarte nach jeder Naht nur im betroffenen Band
 * aufgefrischt statt komplett neu berechnet.
 */

const MAX_PIXELS = 6e6;   // darueber wird es im Browser unzumutbar langsam
const BAND = 3;           // Spalten links und rechts der Naht, die neu bewertet werden

class Feld {
  constructor(canvas, kapazitaet) {
    const w = canvas.width, h = canvas.height;
    this.stride = Math.max(w, kapazitaet);
    this.w = w;
    this.h = h;
    this.data = new Uint8ClampedArray(this.stride * h * 4);
    this.gray = new Float32Array(this.stride * h);
    this.energy = new Float32Array(this.stride * h);
    this.mask = null;

    const img = canvas.getContext('2d', { willReadFrequently: true })
      .getImageData(0, 0, w, h).data;
    for (let y = 0; y < h; y++) {
      this.data.set(img.subarray(y * w * 4, (y + 1) * w * 4), y * this.stride * 4);
    }
    this.berechneGrau();
    this.berechneEnergie(0, w - 1);
  }

  setzeMaske(rect) {
    this.mask = new Float32Array(this.stride * this.h);
    if (!rect) return;
    const x0 = Math.max(0, Math.floor(rect.x)), y0 = Math.max(0, Math.floor(rect.y));
    const x1 = Math.min(this.w, Math.ceil(rect.x + rect.w));
    const y1 = Math.min(this.h, Math.ceil(rect.y + rect.h));
    for (let y = y0; y < y1; y++)
      for (let x = x0; x < x1; x++) this.mask[y * this.stride + x] = 1e5;
    this.berechneEnergie(0, this.w - 1);
  }

  berechneGrau() {
    const { data, gray, stride, w, h } = this;
    for (let y = 0; y < h; y++) {
      const row = y * stride;
      for (let x = 0; x < w; x++) {
        const p = (row + x) * 4;
        gray[row + x] = data[p] * 0.299 + data[p + 1] * 0.587 + data[p + 2] * 0.114;
      }
    }
  }

  /** Energie (Betrag des Helligkeitsgradienten) fuer die Spalten x0..x1. */
  berechneEnergie(x0, x1) {
    const { gray, energy, mask, stride, w, h } = this;
    x0 = Math.max(0, x0); x1 = Math.min(w - 1, x1);
    for (let y = 0; y < h; y++) {
      const row = y * stride;
      const oben = y > 0 ? row - stride : row;
      const unten = y < h - 1 ? row + stride : row;
      for (let x = x0; x <= x1; x++) {
        const links = gray[row + (x > 0 ? x - 1 : 0)];
        const rechts = gray[row + (x < w - 1 ? x + 1 : w - 1)];
        const e = Math.abs(rechts - links) + Math.abs(gray[unten + x] - gray[oben + x]);
        energy[row + x] = mask ? e + mask[row + x] : e;
      }
    }
  }

  /** Senkrechte Naht kleinster Gesamtenergie; liefert je Zeile eine Spalte. */
  findeNaht(M, from, seam) {
    const { energy, stride, w, h } = this;
    for (let x = 0; x < w; x++) M[x] = energy[x];
    for (let y = 1; y < h; y++) {
      const row = y * stride, prev = row - stride;
      for (let x = 0; x < w; x++) {
        let best = M[prev + x], dir = 0;
        if (x > 0) { const v = M[prev + x - 1]; if (v < best) { best = v; dir = -1; } }
        if (x < w - 1) { const v = M[prev + x + 1]; if (v < best) { best = v; dir = 1; } }
        M[row + x] = energy[row + x] + best;
        from[row + x] = dir;
      }
    }
    const last = (h - 1) * stride;
    let x = 0;
    for (let i = 1; i < w; i++) if (M[last + i] < M[last + x]) x = i;
    for (let y = h - 1; y >= 0; y--) {
      seam[y] = x;
      x += from[y * stride + x];
      if (x < 0) x = 0; else if (x > this.w - 1) x = this.w - 1;
    }
    return seam;
  }

  /** Naht herausnehmen: Zeilenrest nach links ruecken, Breite -1. */
  entferneNaht(seam) {
    const { data, gray, energy, mask, stride, w, h } = this;
    for (let y = 0; y < h; y++) {
      const row = y * stride, sx = seam[y];
      if (sx < w - 1) {
        data.copyWithin((row + sx) * 4, (row + sx + 1) * 4, (row + w) * 4);
        gray.copyWithin(row + sx, row + sx + 1, row + w);
        energy.copyWithin(row + sx, row + sx + 1, row + w);
        if (mask) mask.copyWithin(row + sx, row + sx + 1, row + w);
      }
    }
    this.w--;
    this.frischeAuf(seam);
  }

  /** Naht verdoppeln: Zeilenrest nach rechts ruecken, neues Pixel mitteln. */
  fuegeNahtEin(seam) {
    const { data, gray, energy, mask, stride, w, h } = this;
    if (w + 1 > stride) throw new Error('Puffer zu klein fuer weitere Nahtlinien');
    for (let y = 0; y < h; y++) {
      const row = y * stride, sx = seam[y];
      data.copyWithin((row + sx + 2) * 4, (row + sx + 1) * 4, (row + w) * 4);
      gray.copyWithin(row + sx + 2, row + sx + 1, row + w);
      energy.copyWithin(row + sx + 2, row + sx + 1, row + w);
      if (mask) mask.copyWithin(row + sx + 2, row + sx + 1, row + w);

      const a = (row + sx) * 4, neu = (row + sx + 1) * 4;
      const b = sx + 2 <= w ? (row + sx + 2) * 4 : a;
      for (let k = 0; k < 4; k++) data[neu + k] = (data[a + k] + data[b + k]) >> 1;
      gray[row + sx + 1] = (gray[row + sx] + gray[row + Math.min(w, sx + 2)]) / 2;
      // Eingefuegte Naehte verteuern, damit die naechste woanders verlaeuft
      if (mask) mask[row + sx + 1] = (mask[row + sx] || 0) + 150;
    }
    this.w++;
    this.frischeAuf(seam);
  }

  /** Energie rund um die veraenderte Naht neu bewerten. */
  frischeAuf(seam) {
    let min = this.w, max = 0;
    for (let y = 0; y < this.h; y++) {
      if (seam[y] < min) min = seam[y];
      if (seam[y] > max) max = seam[y];
    }
    this.berechneEnergie(min - BAND, max + BAND);
  }

  /** Aktuellen Stand als Canvas ausgeben. */
  zuCanvas() {
    const { data, stride, w, h } = this;
    const c = makeCanvas(w, h);
    const img = new ImageData(w, h);
    for (let y = 0; y < h; y++)
      img.data.set(data.subarray(y * stride * 4, y * stride * 4 + w * 4), y * w * 4);
    c.getContext('2d').putImageData(img, 0, 0);
    return c;
  }
}

function transponiere(canvas) {
  const c = makeCanvas(canvas.height, canvas.width);
  const ctx = c.getContext('2d');
  ctx.translate(c.width / 2, c.height / 2);
  ctx.rotate(Math.PI / 2);
  ctx.scale(1, -1);
  ctx.drawImage(canvas, -canvas.width / 2, -canvas.height / 2);
  return c;
}

async function schnitzeAchse(canvas, anzahl, schutz, onProgress, basis, gesamt, signal) {
  if (anzahl === 0) return canvas;
  const entfernen = anzahl > 0;
  const schritte = Math.abs(anzahl);
  const feld = new Feld(canvas, entfernen ? canvas.width : canvas.width + schritte);
  if (schutz) feld.setzeMaske(schutz);

  const M = new Float32Array(feld.stride * feld.h);
  const from = new Int8Array(feld.stride * feld.h);
  const seam = new Int32Array(feld.h);

  for (let i = 0; i < schritte; i++) {
    feld.findeNaht(M, from, seam);
    if (entfernen) feld.entferneNaht(seam); else feld.fuegeNahtEin(seam);
    if ((i & 15) === 0) {
      if (signal?.aborted) throw new Error('abgebrochen');
      onProgress?.((basis + i) / gesamt);
      await new Promise(r => setTimeout(r, 0));   // Oberflaeche bedienbar halten
    }
  }
  return feld.zuCanvas();
}

/**
 * Inhaltsbasiert auf Zielgroesse bringen.
 * @param {HTMLCanvasElement} canvas Quellbild
 * @param {number} zielW Zielbreite in Pixeln
 * @param {number} zielH Zielhoehe in Pixeln
 * @param {object} opt { schutz:{x,y,w,h}|null, onProgress:fn(0..1), signal:AbortSignal }
 */
async function contentAwareResize(canvas, zielW, zielH, opt = {}) {
  const { schutz = null, onProgress = null, signal = null } = opt;
  const w0 = canvas.width, h0 = canvas.height;
  zielW = Math.max(8, Math.round(zielW));
  zielH = Math.max(8, Math.round(zielH));
  if (w0 * h0 > MAX_PIXELS)
    throw new Error(`Die Ebene ist mit ${(w0 * h0 / 1e6).toFixed(1)} Megapixeln zu gross ` +
      `(Grenze ${MAX_PIXELS / 1e6} MP). Bitte vorher verkleinern.`);

  const dW = w0 - zielW, dH = h0 - zielH;
  const gesamt = Math.abs(dW) + Math.abs(dH) || 1;
  let bild = canvas;

  if (dW !== 0)
    bild = await schnitzeAchse(bild, dW, schutz, onProgress, 0, gesamt, signal);

  if (dH !== 0) {
    // Waagerechte Naehte: gedreht behandeln, danach zurueckdrehen
    const schutzT = schutz
      ? { x: schutz.y, y: schutz.x, w: schutz.h, h: schutz.w }
      : null;
    const gedreht = await schnitzeAchse(transponiere(bild), dH, schutzT,
      onProgress, Math.abs(dW), gesamt, signal);
    bild = transponiere(gedreht);
  }

  onProgress?.(1);
  return bild;
}

const maxPixels = MAX_PIXELS;

];

/** Vom Nutzer geladene Schriften: name -> dataURL (wird im Projekt mitgespeichert) */
const customFonts = new Map();

function familyName(fileName) {
  return fileName.replace(/\.(ttf|otf|woff2?|ttc)$/i, '').replace(/[^\w\s-]/g, '').trim() || 'Eigene Schrift';
}

async function registerFont(name, dataUrl) {
  const face = new FontFace(name, `url(${dataUrl})`);
  await face.load();
  document.fonts.add(face);
  customFonts.set(name, dataUrl);
  return name;
}

async function loadFontFile(file) {
  const dataUrl = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
  return registerFont(familyName(file.name), dataUrl);
}

async function restoreFonts(map) {
  for (const [name, url] of Object.entries(map || {})) {
    try { await registerFont(name, url); } catch (e) { console.warn('Schrift nicht ladbar:', name, e); }
  }
}

function fontOptions() {
  const custom = [...customFonts.keys()].map(n => [`"${n}"`, n + ' (geladen)']);
  return [...custom, ...SYSTEM_FONTS];
}

function serializeFonts() {
  return Object.fromEntries(customFonts);
}
